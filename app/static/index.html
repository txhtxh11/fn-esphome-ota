        const bh1750s = state.devices.filter(d => d.type === "bh1750");

        /* ===== 巴法云：MQTT 直连 bemfa.com =====
           巴法 App 只认裸话题名（如 ehrelay1006，后三位是设备类型），而 ESPHome 的实体话题是
           <topic_prefix>/switch/<id>/state，两者对不上。所以不用内置实体话题：
           on_message 订阅裸话题执行动作，mqtt.publish 往 <topic>/set 主动回传状态/数值。 */
        const bemfaOn = !!state.bemfa.on;
        const bmOff = d => !!(d.io && d.io.bemfa === false);   // 巴法云里被删掉的项
        const bmSw = bemfaOn ? relays.filter(d => !bmOff(d)).map(d => ({ d: d, t: bmTopicOf(d, "006") })) : [];
        const bmSens = bemfaOn
            ? dhts.filter(d => !bmOff(d)).map(d => ({ d: d, t: bmTopicOf(d, "004"), kind: "dht" }))
                .concat(bh1750s.filter(d => !bmOff(d)).map(d => ({ d: d, t: bmTopicOf(d, "004"), kind: "lux" })))
            : [];
        if (bemfaOn) {
            const bmUid = state.bemfa.uid || "在这里填巴法云私钥UID";
            G.push("# ================= 巴法云（安卓「巴法」App / 微信小程序） =================");
            G.push("# 先在巴法云控制台 → MQTT 设备云 建好这些主题（后三位是设备类型：006 开关 / 004 传感器）：");
            bmSw.forEach(x => G.push("#   " + x.t + "   " + x.d.name));
            bmSens.forEach(x => G.push("#   " + x.t + "   " + x.d.name + (x.kind === "dht" ? "（上报 #温度#湿度#）" : "（上报 #光照#）")));
            G.push("# 私钥 UID 同时作为 client_id / username / password；一台设备用一个私钥。");
            G.push("mqtt:");
            G.push("  broker: bemfa.com");
            G.push("  port: 9501");
            G.push('  username: "' + yamlStr(bmUid) + '"');
            G.push('  password: "' + yamlStr(bmUid) + '"');
            G.push('  client_id: "' + yamlStr(bmUid) + '"');
            G.push('  topic_prefix: "esphome_bridge"   # 巴法只认下面的裸话题，这个前缀只是 ESPHome 要求非空');
            G.push("  discovery: false");
            if (bmSw.length) {
                G.push("  on_connect:");
                bmSw.forEach(x => {
                    G.push("    - mqtt.publish:");
                    G.push("        topic: " + x.t + "/set");
                    G.push("        payload: !lambda 'return id(" + x.d.uid + ").state ? \"on\" : \"off\";'");
                });
                G.push("  on_message:");
                bmSw.forEach(x => {
                    G.push("    - topic: " + x.t);
                    G.push("      then:");
                    G.push("        - lambda: |-");
                    G.push('            if (x == "on") { id(' + x.d.uid + ").turn_on(); }");
                    G.push('            else if (x == "off") { id(' + x.d.uid + ").turn_off(); }");
                });
            }
            G.push("");
            if (bmSens.length) {
                G.push("interval:");
                G.push("  - interval: 60s");
                G.push("    then:");
                bmSens.forEach(x => {
                    G.push("      - if:");
                    G.push("          condition:");
                    if (x.kind === "dht") {
                        G.push("            lambda: 'return !isnan(id(" + x.d.uid + "_t).state) && !isnan(id(" + x.d.uid + "_h).state);'");
                        G.push("          then:");
                        G.push("            - mqtt.publish:");
                        G.push("                topic: " + x.t + "/set");
                        G.push("                payload: !lambda |-");
                        G.push("                  char buf[48];");
                        G.push('                  snprintf(buf, sizeof(buf), "#%.1f#%.1f#", id(' + x.d.uid + "_t).state, id(" + x.d.uid + "_h).state);");
                        G.push("                  return std::string(buf);");
                    } else {
                        G.push("            lambda: 'return !isnan(id(" + x.d.uid + ").state);'");
                        G.push("          then:");
                        G.push("            - mqtt.publish:");
                        G.push("                topic: " + x.t + "/set");
                        G.push("                payload: !lambda |-");
                        G.push("                  char buf[32];");
                        G.push('                  snprintf(buf, sizeof(buf), "#%.0f#", id(' + x.d.uid + ").state);");
                        G.push("                  return std::string(buf);");
                    }
                });
            }
            G.push("");
        }

        // 物理按键/传感器的触发器：基础事件直接输出；单击走 on_click；
        // 长按/双击联动与"长按恢复出厂"统一合并进同一个 on_multi_click（重复键会导致编译失败）
        const emitBinActions = (dev, ind) => {
            const opFor = op => OP_YAML[op] || "switch.toggle";
            dev.actions.forEach(act => {
                if (act.event === "on_click") {
                    G.push(ind + "on_click:");
                    G.push(ind + "  min_length: 50ms");
                    G.push(ind + "  max_length: 350ms");
                    G.push(ind + "  then:");
                    G.push(ind + "    - " + opFor(act.op) + ": " + act.target);
                } else if (act.event === "on_state" || act.event === "on_release" || act.event === "on_press") {
                    G.push(ind + act.event + ":");
                    G.push(ind + "  - " + opFor(act.op) + ": " + act.target);
                }
            });
            const multiItems = [];
            dev.actions.forEach(act => {
                if (act.event === "on_long") {
                    multiItems.push({ times: ["- ON for at least 1s"], lines: ["- " + opFor(act.op) + ": " + act.target] });
                } else if (act.event === "on_double") {
                    multiItems.push({ times: ["- ON for at most 0.4s", "- OFF for at most 0.4s", "- ON for at most 0.4s", "- OFF for at least 0.2s"], lines: ["- " + opFor(act.op) + ": " + act.target] });
                }
            });
            // 长按两档：5s 重置配对 / 10s 恢复出厂
            const hkLong = !!(dev.io && dev.io.longReset);
            const facLong = !!(dev.io && dev.io.factoryReset);
            const hkSec = Math.min(Math.max(parseInt(dev.io && dev.io.longResetSec, 10) || 5, 1), 60);
            const facSec = Math.min(Math.max(parseInt(dev.io && dev.io.factoryResetSec, 10) || 10, 1), 60);
            const hkLines = state.chip === "esp8266"
                ? ["- homekit.reset_storage:", "    id: my_hk"]
                : ["- lambda: 'ESP.restart();'"];
            if (hkLong && facLong) {
                // 两个都要：出厂到点即触发；配对必须「按满 N 秒后松手」才触发，避免抢先
                multiItems.push({
                    times: ["- ON for at least " + facSec + "s"],
                    lines: ["- switch.turn_on: wipe_all"]
                });
                multiItems.push({
                    times: ["- ON for at least " + hkSec + "s", "- OFF for at least 0.1s"],
                    lines: hkLines
                });
            } else if (facLong) {
                multiItems.push({
                    times: ["- ON for at least " + facSec + "s"],
                    lines: ["- switch.turn_on: wipe_all"]
                });
            } else if (hkLong) {
                multiItems.push({
                    times: ["- ON for at least " + hkSec + "s"],
                    lines: hkLines
                });
            }
            if (multiItems.length) {
                G.push(ind + "on_multi_click:");
                multiItems.forEach(it => {
                    G.push(ind + "  - timing:");
                    it.times.forEach(t => G.push(ind + "      " + t));
                    G.push(ind + "    then:");
                    it.lines.forEach(l => G.push(ind + "      " + l));
                });
            }
        };

        const switchBlocks = [];
        relays.forEach(dev => {
            const lines = [
                "  - platform: gpio",
                "    id: " + dev.uid,
                '    name: "' + yamlStr(uniqName(dev.name, dev.uid)) + '"',
                "    pin:",
                "      number: " + getPin(dev, "pin")
            ];
            if (dev.io && dev.io.inverted) lines.push("      inverted: true");
            lines.push("    restore_mode: " + (dev.io && dev.io.boot === "on" ? "ALWAYS_ON" : "ALWAYS_OFF"));
            // 事件动作按事件名合并（同一个 on_turn_on 只能出现一次），巴法状态回传也塞进同一组
            const evs = {};
            const addEv = (name, line) => { (evs[name] = evs[name] || []).push(line); };
            dev.actions.forEach(act => addEv(act.event, "- " + (OP_YAML[act.op] || "switch.toggle") + ": " + act.target));
            if (bemfaOn && !(dev.io && dev.io.bemfa === false)) {
                const bt = bmTopicOf(dev, "006");
                addEv("on_turn_on", "- mqtt.publish:");
                addEv("on_turn_on", "    topic: " + bt + "/set");
                addEv("on_turn_on", '    payload: "on"');
                addEv("on_turn_off", "- mqtt.publish:");
                addEv("on_turn_off", "    topic: " + bt + "/set");
                addEv("on_turn_off", '    payload: "off"');
            }
            Object.keys(evs).forEach(name => {
                lines.push("    " + name + ":");
                evs[name].forEach(l => lines.push("      " + l));
            });
            switchBlocks.push(lines);
        });
        // 按键启用「长按恢复出厂」时补一个隐藏的 factory_reset 开关
        const needWipe = state.devices.some(d => d.type === "button" && d.io && d.io.factoryReset);
        if (needWipe) {
            switchBlocks.push([
                "  - platform: factory_reset",
                "    id: wipe_all",
                '    name: "恢复出厂设置"',
                "    internal: true"
            ]);
        }
        if (switchBlocks.length) {
            G.push("switch:");
            switchBlocks.forEach(lines => { lines.forEach(l => G.push(l)); G.push(""); });
        }

        if (bins.length) {
            G.push("binary_sensor:");
            bins.forEach(dev => {
                G.push("  - platform: gpio");
                G.push("    id: " + dev.uid);
                G.push('    name: "' + yamlStr(uniqName(dev.name, dev.uid)) + '"');
                G.push("    pin:");
                G.push("      number: " + getPin(dev, "pin"));
                G.push("      mode: INPUT_PULLUP");
                if (!dev.io || dev.io.inverted) G.push("      inverted: true");
                emitBinActions(dev, "    ");
                G.push("");
            });
        }

        if (dhts.length || bh1750s.length) {
            if (bh1750s.length) {
                G.push("i2c:");
                G.push("  sda: " + getPin(bh1750s[0], "sda"));
                G.push("  scl: " + getPin(bh1750s[0], "scl"));
                G.push("  scan: true");
                G.push("");
            }
            G.push("sensor:");
            dhts.forEach(dev => {
                G.push("  - platform: dht");
                G.push("    pin: " + getPin(dev, "pin"));
                G.push("    temperature:");
                G.push('      name: "' + yamlStr(uniqName(dev.name + ' 温度 (T)', dev.uid + '_t')) + '"');
                G.push("      id: " + dev.uid + "_t");
                G.push("      device_class: temperature");   // ESP32 的 homekit 组件按 device_class 映射服务
                G.push("    humidity:");
                G.push('      name: "' + yamlStr(uniqName(dev.name + ' 湿度 (H)', dev.uid + '_h')) + '"');
                G.push("      id: " + dev.uid + "_h");
                G.push("      device_class: humidity");
                G.push("    update_interval: 30s");
                G.push("");
            });
            bh1750s.forEach(dev => {
                G.push("  - platform: bh1750");
                G.push('    name: "' + yamlStr(uniqName(dev.name, dev.uid)) + '"');
                G.push("    id: " + dev.uid);
                G.push("    device_class: illuminance");
                G.push("    update_interval: 30s");
                G.push("");
            });
        }

        G.push("homekit:");
        if (isEsp32) {
            // homekit-esp32：switch / sensor / binary_sensor 数组，每项 { id, meta.name }，setup_code 可选
            G.push('  setup_code: "' + fmtHkCode(state.hkCode) + '"');
            if (relays.length) {
                G.push("  switch:");
                relays.filter(d => !(d.io && d.io.localOnly)).forEach(dev => {
                    G.push("    - id: " + dev.uid);
                    G.push("      meta:");
                    G.push('        name: "' + yamlStr(dev.name) + '"');
                });
            }
            if (dhts.length || bh1750s.length) {
                G.push("  sensor:");
                dhts.forEach(dev => {
                    G.push("    - id: " + dev.uid + "_t");
                    G.push("      meta:");
                    G.push('        name: "' + yamlStr(dev.name + " 温度") + '"');
                    G.push("    - id: " + dev.uid + "_h");
                    G.push("      meta:");
                    G.push('        name: "' + yamlStr(dev.name + " 湿度") + '"');
                });
                bh1750s.forEach(dev => {
                    G.push("    - id: " + dev.uid);
                    G.push("      meta:");
                    G.push('        name: "' + yamlStr(dev.name) + '"');
                });
            }
            if (bins.length) {
                // homekit-esp32 也支持 binary_sensor（motion / contact / occupancy / smoke）
                const HK_BS_TYPE32 = { pir: "motion", door: "contact", button: "contact" };
                G.push("  binary_sensor:");
                bins.forEach(dev => {
                    G.push("    - id: " + dev.uid);
                    G.push("      type: " + (HK_BS_TYPE32[dev.type] || "motion"));
                });
            }
        } else {
            G.push("  id: my_hk");
            G.push('  setup_code: "' + fmtHkCode(state.hkCode) + '"');
            if (relays.length) {
                G.push("  switches:");
                relays.filter(x => !(x.io && x.io.localOnly)).forEach(dev => G.push("    - " + dev.uid));
            }
            if (bins.length) {
                // 人体感应映射到 HomeKit 的 motion 服务，否则会被当成门窗传感器
                const HK_BS_TYPE = { pir: "motion", door: "contact", button: "contact" };
                G.push("  binary_sensors:");
                bins.forEach(dev => {
                    G.push("    - id: " + dev.uid);
                    G.push("      type: " + (HK_BS_TYPE[dev.type] || "contact"));
                });
            }
            // 温湿度 / 光照也要暴露给 HomeKit：否则这几类设备只进了 HA，家庭 App 里根本看不到。
            // homekit-esp8266 的 schema 是 sensors: [{id, type}]，type 只能是 temperature / humidity / illuminance。
            if (dhts.length || bh1750s.length) {
                G.push("  sensors:");
                dhts.forEach(dev => {
                    G.push("    - id: " + dev.uid + "_t");
                    G.push("      type: temperature");
                    G.push("    - id: " + dev.uid + "_h");
                    G.push("      type: humidity");
                });
                bh1750s.forEach(dev => {
                    G.push("    - id: " + dev.uid);
                    G.push("      type: illuminance");
                });
            }
        }
        G.push("");
        // 这两个实体要靠 HA(api) 或 网页(web_server) 才有入口；两个都关了就不生成
        const hasUi = feat("api") || feat("web");
        if (!isEsp32 && hasUi) {
            // 这两个都是 homekit-esp8266 专属：reset_storage 动作、get_setup_code() 接口
            G.push("button:");
            G.push("  - platform: template");
            G.push('    name: "重置 HomeKit 配对"');
            G.push("    id: reset_homekit_btn");
            G.push('    icon: "mdi:restart-alert"');
            G.push("    on_press:");
            G.push("      - homekit.reset_storage: my_hk");
            G.push("");
            G.push("text_sensor:");
            G.push("  - platform: template");
            G.push('    name: "HomeKit 配对码状态"');
            G.push("    id: hk_setup_text_sensor");
            G.push("    update_interval: 12h");
            G.push("    lambda: |-");
            G.push("      std::string code = id(my_hk)->get_setup_code();");
            G.push('      if (code.empty()) return std::string("等待生成中");');
            G.push("      return code;");
            G.push("");
        } else {
            G.push("# 未开 api / 网页：配对码状态与「重置配对」按钮不生成");
            const lpBtn = state.devices.find(d => d.type === "button" && d.io && d.io.longReset);
            if (lpBtn) {
                const sec = Math.min(Math.max(parseInt(lpBtn.io.longResetSec, 10) || 5, 1), 60);
                G.push("# 重置配对：长按物理按键 " + sec + " 秒");
            } else {
                G.push("# 重置配对：给按键开启「长按重置配对」，或开启 Web 网页 / API");
            }
            G.push("");
        }
        G.push("# ========== 配置结束 ==========");
        // 关掉 HomeKit：把 homekit / 外部组件 / 配对按钮 / 配对码状态 四段整段摘掉
        if (!feat("homekit")) return stripHomekit(G).join("\n");
        return G.join("\n");
    }

    /* ================= 编译：直接产出可用 .bin =================
       后端（esphome-compiler）的产物是 GitHub artifact 的 zip（单层、不加密），里面是
       firmware.bin / firmware.factory.bin / firmware.ota.bin。这里在页面内解包并优先取
       factory（整包镜像，offset 0 直写，ESP32 也适用）。若后端哪天直接给裸 bin 也能用。 */
    const COMPILER = "https://esphome-compiler.pages.dev";
    let compileAbort = null;
    let compileRunning = false;

    /* ---- 最小 zip + ZipCrypto 解密实现（够用即可：只取里面的 .bin） ---- */
    let ZIP_CRC = null;
    function crcTable() {
        if (ZIP_CRC) return ZIP_CRC;
        const t = new Uint32Array(256);
        for (let i = 0; i < 256; i++) {
            let c = i;
            for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
            t[i] = c >>> 0;
        }
        ZIP_CRC = t; return t;
    }
    function zipKeyStream(pw) {
        const tbl = crcTable();
        let k0 = 0x12345678, k1 = 0x23456789, k2 = 0x34567890;
        const upd = b => {
            k0 = (tbl[(k0 ^ b) & 0xff] ^ (k0 >>> 8)) >>> 0;
            k1 = (Math.imul((k1 + (k0 & 0xff)) >>> 0, 134775813) + 1) >>> 0;
            k2 = (tbl[(k2 ^ ((k1 >>> 24) & 0xff)) & 0xff] ^ (k2 >>> 8)) >>> 0;
        };
        for (const ch of new TextEncoder().encode(pw)) upd(ch);
        return b => {
            const tmp = (k2 | 2) >>> 0;
            const p = b ^ (((Math.imul(tmp, tmp ^ 1)) >>> 8) & 0xff);
            upd(p); return p;
        };
    }
    async function unzipBin(blob, password, want) {
        const u8 = new Uint8Array(await blob.arrayBuffer());
        const dv = new DataView(u8.buffer);
        let eocd = -1;
        for (let i = u8.length - 22; i >= Math.max(0, u8.length - 22 - 0xFFFF); i--) {
            if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
        }
        if (eocd < 0) throw new Error("编译产物不是有效 zip");
        const count = dv.getUint16(eocd + 10, true);
        let off = dv.getUint32(eocd + 16, true);
        const list = [];
        for (let i = 0; i < count; i++) {
            if (off + 46 > u8.length || dv.getUint32(off, true) !== 0x02014b50) break;
            const nlen = dv.getUint16(off + 28, true), elen = dv.getUint16(off + 30, true), clen = dv.getUint16(off + 32, true);
            list.push({
                name: new TextDecoder().decode(u8.subarray(off + 46, off + 46 + nlen)),
                flags: dv.getUint16(off + 8, true), method: dv.getUint16(off + 10, true),
                crc: dv.getUint32(off + 16, true),
                csize: dv.getUint32(off + 20, true), usize: dv.getUint32(off + 24, true),
                lho: dv.getUint32(off + 42, true)
            });
            off += 46 + nlen + elen + clen;
        }
        const bins = list.filter(e => /\.bin$/i.test(e.name));
        if (!bins.length) throw new Error("压缩包里没有 .bin 文件");
        // 优先整包镜像：factory > firmware > 体积最大的那个
        const base = e => e.name.split("/").pop().toLowerCase();
        const pick = (want && bins.find(e => base(e) === want)) ||
            bins.find(e => base(e) === "firmware.factory.bin") ||
            bins.find(e => base(e) === "firmware.bin") ||
            bins.sort((a, b) => b.usize - a.usize)[0];
        const lho = pick.lho;
        if (dv.getUint32(lho, true) !== 0x04034b50) throw new Error("zip 目录与文件头不一致");
        let start = lho + 30 + dv.getUint16(lho + 26, true) + dv.getUint16(lho + 28, true);
        let data = u8.subarray(start, start + pick.csize);
        if (pick.flags & 1) {
            if (!password) throw new Error("产物是加密压缩包，当前服务已不再加密，请稍后重试");
            if (data.length <= 12) throw new Error("压缩包数据不完整");
            const dec = zipKeyStream(password);
            for (let i = 0; i < 12; i++) dec(data[i]);      // 12 字节加密头丢弃
            const out = new Uint8Array(data.length - 12);
            for (let i = 12; i < data.length; i++) out[i - 12] = dec(data[i]);
            data = out;
        }
        if (pick.method === 0) return new Blob([data], { type: "application/octet-stream" });
        if (pick.method !== 8) throw new Error("不支持的压缩方式 " + pick.method);
        if (typeof DecompressionStream === "undefined") throw new Error("浏览器不支持自动解压，请更新 Chrome / Edge");
        let raw;
        try {
            const ds = new DecompressionStream("deflate-raw");
            const wr = ds.writable.getWriter();
            wr.write(data); wr.close();
            raw = await new Response(ds.readable).arrayBuffer();
        } catch (e) {
            throw new Error("固件解包失败（密码或产物异常）");
        }
        if (pick.crc) {
            const u = new Uint8Array(raw), tbl = crcTable();
            let c = 0xFFFFFFFF;
            for (let i = 0; i < u.length; i++) c = (tbl[(c ^ u[i]) & 0xff] ^ (c >>> 8)) >>> 0;
            if (((c ^ 0xFFFFFFFF) >>> 0) !== pick.crc) throw new Error("固件校验不通过（解包结果损坏）");
        }
        return new Blob([raw], { type: "application/octet-stream" });
    }
    // 产物归一化：裸 bin 直接用；zip（含 GitHub artifact 的无密码包）页面内解包
    async function artifactToBin(blob, password) {
        const head = new Uint8Array(await blob.slice(0, 4).arrayBuffer());
        if (head[0] === 0xE9 || head[0] === 0xEA) return blob;          // 已是镜像本体
        if (head[0] === 0x50 && head[1] === 0x4B) return unzipBin(blob, password);  // PK → zip
        throw new Error("拿到的不是固件（可能被网关拦截或返回了错误页）");
    }

    function showToast(msg, ms) {
        const t = document.createElement("div");
        t.className = "toast";
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => t.classList.add("show"), 10);
        setTimeout(() => { t.classList.remove("show"); setTimeout(() => t.remove(), 300); }, ms || 2200);
    }

    // 有些库/驱动在串口打不开时只弹原生 alert（一句英文 + 确定），这里拦截成可操作的排查提示
    if (typeof window !== "undefined" && window.alert) {
        const _nativeAlert = window.alert.bind(window);
        window.alert = function (m) {
            const s = String(m || "");
            if (/open/i.test(s) && /serialport|serial/i.test(s)) {
                console.warn("[串口打开失败]", s);
                flashLog("ERROR 操作系统拒绝打开串口：" + s);
                showToast("串口打开失败，依次排查：① 关掉串口监视器等其他占用程序和别的烧录页 ② 拔掉 USB 等 5 秒重插再试 ③ 仍不行：设备管理器把该 COM 口波特率改为 115200，或重装 CH340/CP210x 驱动", 7000);
                return;
            }
            _nativeAlert(s);
        };
    }

    function closeCompile() {
        $("compileStatus").classList.remove("show", "done");
        document.body.classList.remove("compiling");
        const btn = $("btnCompile");
        if (btn) btn.classList.remove("on");
        compileAbort = null;
        compileRunning = false;
    }

    // 左卡文案统一入口（title 存全文，卡面超长自动省略）
    function setCompileMsg(t) {
        const m = $("compileMsg");
        m.textContent = t;
        m.title = t;
    }

    // 状态条：左卡=编译状态（完成时点一下下载 bin），右卡=编译中「取消」/ 其余「关闭」
    function compileActions(phase, onCancel) {
        const box = $("compileStatus");
        const row = $("csRow");
        const act = $("compileCancel");
        const running = phase === "running";
        row.hidden = false;
        box.classList.toggle("done", phase === "done");
        act.textContent = running ? "取消" : "关闭";
        act.className = "cs-act" + (running ? " danger" : "");
        act.onclick = running ? (onCancel || closeCompile) : closeCompile;
        $("compileMsg").onclick = phase === "done"
            ? () => { flashState.binOpen = !flashState.binOpen; renderFlashPick(); }
            : null;
        paintBinPick();
    }

    async function downloadCompiled() {
        if (!flashState.compiled) return;
        const kind = flashState.binKind || "bin";
        const meta = BIN_KINDS.find(x => x[0] === kind) || BIN_KINDS[2];
        try {
            let blob = await binBlob(kind).catch(() => null);
            if (!blob && flashState.binUrl) blob = await (await fetch(flashState.binUrl)).blob();
            if (!blob) return;
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = meta[1];
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 5000);
            showToast("已下载 " + meta[1] + " · " + fmtSize(blob.size));
        } catch (e) {
            showToast("取不到 " + meta[1]);
        }
    }

    // 编译产物里的三种 bin：factory（串口整包）/ ota（空中升级）/ bin（纯 app）
    const BIN_KINDS = [
        ["factory", "firmware.factory.bin", "串口整包"],
        ["ota", "firmware.ota.bin", "空中升级"],
        ["bin", "firmware.bin", "应用分区"]
    ];
    async function binBlob(kind) {
        if (!flashState.zipBlob) return null;
        flashState.kindBlobs = flashState.kindBlobs || {};
        if (flashState.kindBlobs[kind]) return flashState.kindBlobs[kind];
        const want = (BIN_KINDS.find(k => k[0] === kind) || BIN_KINDS[2])[1];
        const blob = await unzipBin(flashState.zipBlob, null, want);
        flashState.kindBlobs[kind] = blob;
        return blob;
    }
    // 三个 bin 卡片：点哪张就选中哪张，下载/烧录/OTA 都按选中的来
    function paintBinPick() {
        const box = $("csBins");
        if (!box) return;
        box.hidden = !(flashState.compiled && flashState.mode === "auto" && flashState.binOpen);
        if (box.hidden) return;
        Array.prototype.forEach.call(box.querySelectorAll(".cs-bin"), b => {
            const k = b.dataset.kind;
            b.classList.toggle("on", k === flashState.binKind);
            const meta = BIN_KINDS.find(x => x[0] === k);
            b.textContent = meta ? meta[0] : k;
            b.title = meta ? meta[1] + " · " + meta[2] : "";
        });
    }

    // 编译产物里的三种 bin：factory（串口整包）/ ota（空中升级）/ bin（纯 app）
    async function downloadBinKind(kind) {
        if (!flashState.zipBlob) { showToast("先点「编译」生成固件"); return; }
        const want = kind === "factory" ? "firmware.factory.bin" : (kind === "ota" ? "firmware.ota.bin" : "firmware.bin");
        try {
            const blob = await unzipBin(flashState.zipBlob, null, want);
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url; a.download = want;
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 5000);
            showToast("已下载 " + want + " · " + fmtSize(blob.size));
        } catch (e) {
            showToast("取不到 " + want);
        }
    }

    // 只走 OTA 的设备（没法接串口）需要的是 firmware.ota.bin，不是合并后的 factory.bin
    async function downloadOta() {
        if (!flashState.zipBlob) {
            showToast("先点「编译」生成固件，再来取 OTA 镜像");
            return;
        }
        if (flashState.otaTooBig) {
            showToast("固件 " + fmtSize(flashState.compiled.blob.size) + " 超过 OTA 上限 " +
                Math.round((flashState.otaMax || 520192) / 1024) + " KB，网页 OTA 会失败，请用串口刷", 6000);
            return;
        }
        try {
            const head = new Uint8Array(await flashState.zipBlob.slice(0, 4).arrayBuffer());
            if (!(head[0] === 0x50 && head[1] === 0x4B)) {
                showToast("这次产物不是压缩包，取不到单独的 OTA 镜像");
                return;
            }
            const ota = await unzipBin(flashState.zipBlob, null, "firmware.ota.bin");
            const url = URL.createObjectURL(ota);
            const a = document.createElement("a");
            a.href = url;
            a.download = "firmware-ota.bin";
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
            showToast("已下载 OTA 镜像：到设备网页的 OTA Update 上传");
        } catch (e) {
            showToast("OTA 镜像提取失败：" + ((e && e.message) || e), 4000);
        }
    }

    // 编译一次，返回可直接烧录的 bin（onTick 用于刷新进度文案）
    // 配置代码里手动改过的内容（编译/复制/下载/存模板都用它）
    const codeState = { dirty: false, text: "" };
    function yamlForUse() {
        return codeState.dirty && codeState.text.trim() ? codeState.text : buildYaml();
    }
    function paintCodeHint() {
        const bad = state.bemfa.on && !/^[A-Za-z0-9]{8,}$/.test(state.bemfa.uid || "");
        const hint = $("codeHint");
        const parts = [];
        if (bad) parts.push("缺私钥");
        if (codeState.dirty) parts.push("已改 · 点此恢复");
        hint.textContent = parts.length ? "· " + parts.join(" · ") : "";
        hint.hidden = !parts.length;
        hint.style.cursor = codeState.dirty ? "pointer" : "";
        hint.onclick = codeState.dirty
            ? () => { codeState.dirty = false; codeState.text = ""; $("codeOut").value = buildYaml(); paintCodeHint(); }
            : null;
    }

    async function runCompile(onTick) {
        const y = yamlForUse();
        // 模板变量没填会留下 {{x}}，直接拦住，别把坏 YAML 送去编译
        const left = (y.match(/\{\{\s*[A-Za-z0-9_.-]+\s*\}\}/g) || []);
        if (left.length) { const err = new Error("模板变量没填：" + Array.from(new Set(left)).join("、")); err.userFacing = true; throw err; }
        const cmNow = cmDev();
        const cmNowDef = cmNow ? cmDef(cmNow.type) : null;
        const deviceName = (state.nodeName || "").trim() ||
            (cmNowDef ? (cmNowDef.node || tplSlug(cmNow.name)) : "esp_homekit_device");
        const board = cmNowDef ? (cmNowDef.builtin ? "esp12e" : currentBoardId()) : currentBoardId();
        const sig = compileAbort.signal;
        const enc = btoa(unescape(encodeURIComponent(y)));
        let d;
        try {
            const res = await fetch(COMPILER + "/api/compile", {
                method: "POST", headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ encodedYaml: enc, deviceName: deviceName, board: board }), signal: sig
            });
            d = await res.json().catch(() => ({}));
            if (!res.ok || !(d.runId || d.requestId)) throw new Error(d.message || ("提交编译失败 " + res.status));
        } catch (e) {
            if (e && e.name === "AbortError") throw e;
            // fetch 失败的现实原因只有两种：页面被 CSP 拦（WorkBuddy 预览服务会注入 CSP 响应头，
            // 换浏览器打开同一地址也没用），或页面域名不在服务端白名单。按路径指纹区分提示。
            if (e && (e.name === "TypeError" || /fetch/i.test(e.message || ""))) {
                const previewPage = location.pathname.indexOf("/static-html/") === 0;
                throw new Error(previewPage
                    ? "这个预览地址带了安全策略(CSP)，禁止访问外部接口，在这里无法编译：请直接双击打开本文件（file:// 方式）使用"
                    : "连不上编译服务：本页域名可能不在服务端 ALLOWED_ORIGINS 白名单（本机与内网网段已自动放行）");
            }
            throw e;
        }
        const key = String(d.runId || d.requestId);
        let s = null;
        const t0 = Date.now();
        while (Date.now() - t0 < 10 * 60 * 1000) {
            await new Promise(x => setTimeout(x, 3000));
            if (sig.aborted) throw Object.assign(new Error("已取消"), { name: "AbortError" });
            const sr = await fetch(COMPILER + "/api/status/" + encodeURIComponent(key), { signal: sig });
            s = await sr.json().catch(() => ({}));
            if (!sr.ok) throw new Error(s.message || ("查询编译状态失败 " + sr.status));
            if (s.status === "completed" && s.conclusion === "success") break;
            if (s.conclusion === "failure" || s.conclusion === "cancelled" ||
                (s.status === "completed" && s.conclusion !== "success")) {
                throw new Error("编译失败" + (s.conclusion ? "：" + s.conclusion : ""));
            }
            if (onTick) onTick("编译中 " + Math.round((Date.now() - t0) / 1000) + "s（首次约 2-3 分钟）");
        }
        if (!s || s.status !== "completed" || s.conclusion !== "success") throw new Error("编译超时");
        const raw = s.artifactUrl || s.firmwareUrl || s.binUrl || "";
        /* v8 ignore next */
        const dl = /^https?:/i.test(raw) ? raw : (raw ? COMPILER + raw : "");
        if (!dl) throw new Error("编译完成但没有固件地址");
        if (onTick) onTick("正在取回固件…");
        const fr = await fetch(dl, { signal: sig });
        if (!fr.ok) throw new Error("固件下载失败 " + fr.status);
        const rawBlob = await fr.blob();
        const blob = await artifactToBin(rawBlob);
        if (!blob.size) throw new Error("固件为空");
        return { blob: blob, zip: rawBlob, yaml: y, dl: dl, at: Date.now() };
    }

    // 编译结果落到烧录卡片：之后点烧录不用再编译
    function setCompiled(res) {
        if (flashState.binUrl) URL.revokeObjectURL(flashState.binUrl);
        flashState.compiled = res;
        flashState.zipBlob = res.zip || null;   // 保留原始 zip，OTA 镜像从这里取
        flashState.binUrl = URL.createObjectURL(res.blob);
        flashState.compiledYaml = res.yaml;
        flashState.err = "";
        // 1MB 设备的 OTA 槽只有 508 KB，固件超了就别走网页 OTA（会写到一半失败）
        const mb = flashMbNow();
        const otaMax = mb >= 2 ? 1048576 : 520192;
        flashState.otaTooBig = res.blob.size > otaMax;
        flashState.kindBlobs = {};                       // 新产物，缓存作废
        flashState.binKind = state.chip === "esp32" ? "factory" : "bin";
        flashState.binOpen = false;   // 编译完先收起，点「已编译成功」再展开
        paintBinPick();
        flashState.otaMax = otaMax;
        // 状态条若还开着（比如在烧录卡片里重新编译过），同步刷新它的完成文案
        const bar = $("compileStatus");
        if (bar && bar.classList.contains("show")) {
            setCompileMsg("编译完成 · firmware.bin " + fmtSize(res.blob.size) +
                (flashState.otaTooBig
                    ? " ⚠ 超过 " + Math.round(otaMax / 1024) + " KB 的 OTA 上限，只能串口刷"
                    : " ↓"));
            compileActions("done");
        }
    }

    // 当前芯片选的 FLASH 容量（MB）：自定义时读手填数字
    function flashMbNow() {
        const v = state.flash[state.chip];
        if (v === "custom") return parseFloat(state.customFlash[state.chip]) || 0;
        return parseFloat(v) || 0;
    }

    async function smartCompile() {
        const btn = $("btnCompile");
        const box = $("compileStatus");
        // 前置条件不满足时：不弹 toast，直接把提示写在状态卡左卡上
        const note = text => {
            btn.classList.add("on");
            box.classList.add("show");
            document.body.classList.add("compiling");
            setCompileMsg(text);
            compileActions("note");
        };
        if (compileAbort) return;   // 正在编译：状态卡已是「编译中」，不再弹提示
        if (!state.devices.length) { note("先加设备"); return; }
        // 巴法云开了却没填私钥：生成的代码里是占位符，先提示再编
        if (state.bemfa.on && !/^[A-Za-z0-9]{8,}$/.test(state.bemfa.uid || "")) { note("巴法云缺私钥"); return; }
        flashState.err = "";
        btn.classList.add("on");
        box.classList.add("show");
        document.body.classList.add("compiling");
        setCompileMsg("提交编译...");
        compileAbort = new AbortController();
        compileRunning = true;
        // 取消：只中止任务，出栈交给 catch/finally。
        // 烧录卡开着时不能在这里 closeCompile()，否则卡片被隐藏而 flashCardOpen 仍是 true，
        // 再点底部「烧录」会被当成“收起”，要连点两次才能重新打开。
        compileActions("running", function () {
            if (compileAbort) compileAbort.abort();
            if (!flashCardOpen) closeCompile();
        });
        if (flashCardOpen) $("flashPick").hidden = true; // 编译中收起来源选择，进度独占状态卡
        try {
            const res = await runCompile(txt => setCompileMsg(txt));
            setCompiled(res);
            setCompileMsg("编译完成 · firmware.bin " + fmtSize(res.blob.size) + " ↓");
            compileActions("done");
        } catch (e) {
            if (e && e.name === "AbortError") {
                if (flashCardOpen) renderFlashPick();
                return;
            }
            flashState.err = (e && e.message) || String(e);
            setCompileMsg("编译失败 · " + flashState.err);
            compileActions("fail");
        } finally {
            btn.classList.remove("on");
            compileAbort = null;
            compileRunning = false;
            if (flashCardOpen) renderFlashPick();
        }
    }

    /* ================= 复制 / 下载 / 代码弹层 ================= */
    function ensureDevices() {
        if (!state.devices.length) {
            showToast("请先添加至少一个设备");
            return false;
        }
        return true;
    }

    async function copyText(txt) {
        try { await navigator.clipboard.writeText(txt); return true; }
        catch (e) {
            const ta = document.createElement("textarea");
            ta.value = txt;
            ta.style.position = "fixed"; ta.style.opacity = "0";
            document.body.appendChild(ta); ta.select();
            let ok = false;
            try { ok = document.execCommand("copy"); } catch (e2) {}
            ta.remove(); return ok;
        }
    }

    async function quickCopy() {
        if (!ensureDevices()) return;
        const ok = await copyText(yamlForUse());
        showToast(ok ? "✅ YAML 已复制到剪贴板" : "❌ 复制失败，请在代码弹层中手动复制");
    }

    function quickDownload() {
        if (!ensureDevices()) return;
        const cmNow = cmDev();
        const cmNowDef = cmNow ? cmDef(cmNow.type) : null;
        const fileName = cmNowDef ? (cmNowDef.file || tplSlug(cmNow.name) + ".yaml") : "esphome-config.yaml";
        const blob = new Blob([yamlForUse()], { type: "text/yaml;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = fileName;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        showToast("⬇️ 已开始下载 " + fileName);
    }

    function openCode() {
        const ta = $("codeOut");
        ta.value = codeState.dirty ? codeState.text : buildYaml();
        // 手动改过的内容会被编译、复制、下载、存模板一并采用
        ta.oninput = () => {
            codeState.dirty = true;
            codeState.text = ta.value;
            paintCodeHint();
        };
        paintCodeHint();
        showSheet("codeSheet");
    }

    /* ================= 页内烧录（Web Serial / 安卓 WebUSB） =================
       不再经过 esp-web-tools 的白色安装弹窗：直接用 esptool-js（ESP Web Tools 底层
       用的同一个烧录引擎）驱动串口，授权、擦除、写入、进度、结果全部在这张卡片里，
       页面上不会出现任何弹窗。 */
    const ESTOOL_CDN = [
        "https://cdn.jsdelivr.net/npm/esptool-js@0.6/+esm",
        "https://fastly.jsdelivr.net/npm/esptool-js@0.6/+esm",
        "https://esm.sh/esptool-js@0.6"
    ];
    // mode：auto=按当前配置编译后直烧（默认）· file=本地 .bin · url=固件直链
    const flashState = {
        mode: "auto", file: null, blobUrl: "", url: "",
        compiled: null, binUrl: "", zipBlob: null, compiledYaml: "", err: "", erase: true
    };
    /* 共用日志窗口：烧录日志（console 镜像）与串口监视器输出同窗。
       每行 = { k: "flash"|"serial"|"sys", s: 文本 }，烧录灰、串口亮、系统提示主题色 */
    const flashLogLines = [];
    const LOG_CAP = 200; // 行数上限，超出丢头部
    function pushLog(kind, s) {
        flashLogLines.push({ k: kind, s: s });
        if (flashLogLines.length > LOG_CAP) flashLogLines.splice(0, flashLogLines.length - LOG_CAP);
        renderFlashLog();
    }
    function flashLog(s) {
        pushLog("flash", "[" + new Date().toTimeString().slice(0, 8) + "] " + s);
    }
    function renderFlashLog() {
        const el = $("flashLog");
        if (!el) return;
        if (!flashCardOpen) { el.hidden = true; return; }
        el.hidden = false;
        el.innerHTML = "";
        if (!flashLogLines.length) {
            const d = document.createElement("div");
            d.style.opacity = ".6";
            d.textContent = "日志会出现在这里（串口无输出按一下板上 RST）";
            el.appendChild(d);
        }
        flashLogLines.slice(-40).forEach(l => {
            const d = document.createElement("div");
            d.className = l.k === "flash" ? "" : "ln-" + l.k;
            // ERROR/WARN（烧录日志）与 [E]/W (ESPHome 串口日志) 标红加粗
            if (/ERROR|WARN|\[E\]\[|(^|\s)W[\s:]/.test(l.s)) { const b = document.createElement("b"); b.textContent = l.s; d.appendChild(b); }
            else d.textContent = l.s;
            el.appendChild(d);
        });
        el.scrollTop = el.scrollHeight;
    }
    (function hookConsole() {
        ["log", "warn", "error"].forEach(k => {
            const orig = console[k] ? console[k].bind(console) : function () { };
            console[k] = function () {
                try {
                    const s = Array.prototype.map.call(arguments, a => {
                        if (typeof a === "string") return a;
                        try { return JSON.stringify(a); } catch (e) { return String(a); }
                    }).join(" ");
                    flashLog((k === "error" ? "ERROR " : k === "warn" ? "WARN " : "") + s);
                } catch (e) { }
                orig.apply(console, arguments);
            };
        });
    })();
    // fetch 监控：烧录窗口读 manifest / 固件都走 fetch，卡住或失败会在这里现形
    if (typeof window !== "undefined" && window.fetch) {
        const _fetch = window.fetch.bind(window);
        window.fetch = function (u, o) {
            const url = String(u && (u.url || u));
            if (/^blob:|^data:|\/api\//.test(url)) flashLog("fetch → " + url.slice(0, 120));
            return _fetch(u, o).then(r => {
                if (/^blob:|^data:|\/api\//.test(url)) flashLog("fetch ← " + r.status + " " + url.slice(0, 80));
                return r;
            }, e => {
                flashLog("ERROR fetch 失败 " + url.slice(0, 80) + " " + ((e && e.message) || e));
                throw e;
            });
        };
    }
    let esptoolPromise = null;   // 模块加载缓存
    let flashRunning = false;    // 正在烧录：期间禁止关闭卡片/开监视器

    // 加载 esptool-js（ESM）：多源 + 12 秒超时，国内网络下卡死不报错也能自动换源
    function loadEsptool() {
        if (esptoolPromise) return esptoolPromise;
        esptoolPromise = (async () => {
            for (const url of ESTOOL_CDN) {
                flashLog("加载烧录引擎：" + url.split("/")[2] + "…");
                try {
                    const m = await Promise.race([
                        import(url),
                        new Promise((_, rej) => setTimeout(() => rej(new Error("加载超时(12s)")), 12000))
                    ]);
                    if (m && m.ESPLoader && m.Transport) { flashLog("烧录引擎就绪"); return m; }
                    flashLog("WARN 该源没有导出 ESPLoader，换下一个");
                } catch (e) {
                    flashLog("WARN 该源加载失败(" + ((e && e.message) || e) + ")，换下一个");
                }
            }
            esptoolPromise = null;   // 允许下次重试
            throw new Error("烧录引擎加载失败：请检查网络/代理后重试");
        })();
        return esptoolPromise;
    }

    function flashSecure() {
        return !!window.isSecureContext || location.protocol === "file:" ||
            /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
    }
    function flashSupport() {
        if (!flashSecure()) return { ok: false, why: "浏览器要求 HTTPS 或 localhost 才能调用串口" };
        if (!("serial" in navigator)) return { ok: false, why: "这个浏览器不支持 Web Serial：请用桌面版 Chrome / Edge，或用 Chrome（安卓）+ OTG 线打开" };
        return { ok: true, why: "" };
    }
    // 烧录前后要用的芯片提示（esptool 会自己识别，这里只用于比对上方选择）
    function chipFamilyOf(name) {
        const s = String(name || "");
        if (/ESP32/i.test(s)) return "esp32";
        if (/ESP8266/i.test(s)) return "esp8266";
        return "";
    }
    // 从固件镜像本身判断它给哪种芯片用（本地 / 直链固件不归本页编译，必须靠它兜底）
    // ESP32 的 app 描述符里有魔数 0xABCD5432 且紧跟可读的版本/工程名；ESP8266 镜像没有这些
    const ESP_IMG_CHIPS = { 0: "ESP32", 2: "ESP32-S2", 5: "ESP32-C3", 9: "ESP32-S3", 12: "ESP32-C2", 13: "ESP32-C6", 16: "ESP32-H2" };
    function asciiRun(u8, start, len) {
        let n = 0;
        for (let k = start; k < start + len && k < u8.length; k++) {
            const c = u8[k];
            if (c === 0) break;
            if (c < 0x20 || c > 0x7E) return 0;
            n++;
        }
        return n;
    }
    function imageInfo(u8) {
        const info = { family: "", model: "", modelId: -1 };
        if (!u8 || u8.length < 64) return info;
        const limit = Math.min(u8.length - 4, 0x400000);
        for (let i = 0; i < limit; i++) {
            if (u8[i] === 0x32 && u8[i + 1] === 0x54 && u8[i + 2] === 0xCD && u8[i + 3] === 0xAB &&
                (asciiRun(u8, i + 16, 32) >= 2 || asciiRun(u8, i + 48, 32) >= 2)) {
                info.family = "esp32";
                break;
            }
        }
        if (!info.family) {
            if (u8[0] === 0xE9) info.family = "esp8266";
            return info;
        }
        // 已经确认是 ESP32，再顺手把具体型号认出来（镜像头 chip_id：0/0x1000 两处）
        for (const off of [0, 0x1000]) {
            if (off + 16 > u8.length) continue;
            if (u8[off] !== 0xE9) continue;
            const segs = u8[off + 1];
            const id = u8[off + 12] | (u8[off + 13] << 8);
            if (segs >= 1 && segs <= 16 && ESP_IMG_CHIPS[id] !== undefined) {
                info.modelId = id;
                info.model = ESP_IMG_CHIPS[id];
                break;
            }
        }
        return info;
    }
    // esptool 报的芯片名 → 镜像头里的 chip_id
    function hwChipId(name) {
        const s = String(name || "");
        if (/S3/.test(s)) return 9;
        if (/C3/.test(s)) return 5;
        if (/C6/.test(s)) return 13;
        if (/C2/.test(s)) return 12;
        if (/S2/.test(s)) return 2;
        if (/H2/.test(s)) return 16;
        if (/ESP32/.test(s)) return 0;
        return -1;
    }
    // 当前可用固件：自动编译模式取已编译产物，否则取本地文件 / 直链
    function flashFirmwareUrl() {
        if (flashState.mode === "auto") return flashState.binUrl || "";
        return flashState.mode === "file" ? flashState.blobUrl : (flashState.url || "").trim();
    }
    // 已编译的固件是否还对得上当前配置
    function compiledFresh() {
        return !!(flashState.compiled && flashState.compiledYaml === buildYaml());
    }
    // 配置改了就丢掉旧产物，避免拿过期固件去烧
    function dropCompiled() {
        if (flashState.binUrl) URL.revokeObjectURL(flashState.binUrl);
        flashState.binUrl = "";
        flashState.compiled = null;
        flashState.compiledYaml = "";
    }
    function fmtSize(n) {
        if (n >= 1048576) return (n / 1048576).toFixed(2) + " MB";
        if (n >= 1024) return Math.round(n / 1024) + " KB";
        return n + " B";
    }
    // 当前固件的二进制：编译产物 / 本地文件 / 直链下载
    async function flashFirmwareBlob() {
        if (flashState.mode === "auto") {
            if (!flashState.compiled) return null;
            const b = await binBlob(flashState.binKind || "bin").catch(() => null);
            return b || flashState.compiled.blob;   // 没 zip 时退回编译产物本身
        }
        if (flashState.mode === "file") return flashState.file || null;
        const u = (flashState.url || "").trim();
        if (!u) return null;
        flashLog("下载固件：" + u.slice(0, 80));
        const r = await fetch(u);
        if (!r.ok) throw new Error("固件下载失败 " + r.status + "（直链需要允许跨域 CORS）");
        return await r.blob();
    }

    /* ===== 烧录工作流：复用编译状态卡 =====
       底部「烧录」按钮只负责展开/收起这张卡；卡内先选来源，再由卡内主按钮显式发起
       编译或烧录（打开卡片不会自动开始编译）。 */
    let flashCardOpen = false;

    function openFlashCard() {
        flashCardOpen = true;
        $("compileStatus").classList.add("show");
        $("btnFlash").classList.add("on");
        $("dlgMirror").hidden = true;
        renderFlashPick();
        renderFlashLog(); // 恢复显示之前的烧录日志（如有）
        renderMonBox();   // 工具行（擦除 / 监视）随卡显示
        renderErase();
        loadEsptool().catch(() => { }); // 预加载烧录引擎，点「开始烧录」时就不必等
        // 这里只展开卡片：编译与烧录都由卡内主按钮触发，避免误点就烧
    }

    function closeFlashCard() {
        if (flashRunning) { showToast("正在烧录，等它写完再关卡片", 3000); return; }
        flashCardOpen = false;
        $("btnFlash").classList.remove("on");
        $("flashPick").hidden = true;
        $("flashLog").hidden = true;
        $("monBox").hidden = true;
        $("dlgMirror").hidden = true;
        // 监视器还连着就顺手断开，避免占着串口
        if (monActive) monToggle();
        // 编译还在跑就只隐藏卡片（任务继续跑，完成后再点开能看到结果）；否则整卡收掉
        if (compileAbort) $("compileStatus").classList.remove("show");
        else closeCompile();
    }

    function renderFlashPick() {
        const pick = $("flashPick");
        if (!flashCardOpen) { pick.hidden = true; return; }
        pick.hidden = false;
        pick.innerHTML = "";

        // 三个固件来源做成一行按钮卡；本地固件由下面三段卡的左段直接当选择器
        let applyGo = function () { };
        const srcRow = document.createElement("div");
        srcRow.className = "src-row";
        [["auto", "⚡ 编译烧录"], ["file", "📄 本地 bin"], ["url", "🔗 直链"]].forEach(([v, label]) => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "src-btn" + (flashState.mode === v ? " on" : "");
            b.textContent = label;
            b.addEventListener("click", () => {
                // 改用本地/直链固件时，正在进行的那次编译就没必要了
                if (flashState.mode !== v && v !== "auto" && compileAbort) compileAbort.abort();
                flashState.mode = v;
                renderFlashPick();
            });
            srcRow.appendChild(b);
        });
        pick.appendChild(srcRow);

        // 固件状态、地址、下载、清空、开始烧录都在下面三张并排卡片里，不再单独占一行
        if (compileAbort) return;
        $("csRow").hidden = true;

        // 卡内主操作：一张卡三段均分——固件信息 / 清空 / 开始烧录。
        // 本地 bin 的左段本身就是选择器（点一下选文件），所以本地/直链也始终显示这条卡。
        const goState = () => {
            let label = "开始烧录", off = false, act = flashNow;
            if (flashState.mode === "auto") {
                if (!compiledFresh()) { label = flashState.err ? "重试编译" : "开始编译"; act = smartCompile; }
                else { label = "重新编译"; act = smartCompile; }
            } else if (flashState.mode === "file") {
                if (!flashState.file) off = true;
            } else if (!/^https?:\/\/\S+/i.test((flashState.url || "").trim())) {
                off = true;
            }
            return { label: label, off: off, act: act };
        };
        // 左段文案：编译产物 / 本地文件 / 直链文件名
        const fwSummary = () => {
            if (flashState.mode === "auto") {
                if (flashState.compiled && compiledFresh()) return "已编译成功";
                return flashState.err ? "编译失败" : "未编译";
            }
            if (flashState.mode === "file") {
                return flashState.file ? flashState.file.name : "选择固件";
            }
            const u = (flashState.url || "").trim();
            if (!u) return "未填写地址";
            try { return decodeURIComponent(new URL(u).pathname.split("/").pop() || u); } catch (e) { return u; }
        };
        const canClear = () => flashState.mode === "auto"
            ? !!(flashState.compiled || flashState.err)
            : flashState.mode === "file" ? !!flashState.file : !!(flashState.url || "").trim();
        // 中段「清空」：把当前来源已选/已生成的内容清掉（编译产物、本地文件、直链地址）
        const clearFw = () => {
            if (flashState.mode === "auto") { dropCompiled(); flashState.err = ""; }
            else if (flashState.mode === "file") {
                if (flashState.blobUrl) URL.revokeObjectURL(flashState.blobUrl);
                flashState.file = null; flashState.blobUrl = "";
            } else flashState.url = "";
            renderFlashPick();
        };

        const bar = document.createElement("div");
        bar.className = "cs-bar";
        const canDownload = flashState.mode === "auto" && !!flashState.compiled;
        let info = null, fileInput = null;
        if (flashState.mode === "url") {
            // 直链：地址输入框就是左卡（不再单独占一行）
            const urlInput = document.createElement("input");
            urlInput.className = "fwinfo-input";
            urlInput.type = "url";
            urlInput.inputMode = "url";
            urlInput.placeholder = "https://…/firmware.bin";
            urlInput.value = flashState.url;
            // 只更新按钮态，不重建 DOM（重建会让输入框失焦）
            urlInput.addEventListener("input", () => {
                flashState.url = urlInput.value;
                applyGo();
            });
            bar.appendChild(urlInput);
        } else {
            // 本地 bin：左卡就是选择器（点一下选/重选文件）；编译产物：左卡兼作下载
            if (flashState.mode === "file") {
                fileInput = document.createElement("input");
                fileInput.type = "file";
                fileInput.accept = ".bin";
                fileInput.style.display = "none";
                fileInput.addEventListener("change", () => {
                    const f = fileInput.files && fileInput.files[0];
                    if (!f) return;
                    if (!/\.bin$/i.test(f.name)) { showToast("请选择 .bin 固件文件"); return; }
                    if (flashState.blobUrl) URL.revokeObjectURL(flashState.blobUrl);
                    flashState.file = f;
                    flashState.blobUrl = URL.createObjectURL(f);
                    renderFlashPick();
                });
                pick.appendChild(fileInput);
            }
            const clickable = flashState.mode === "file" || canDownload;
            info = document.createElement(clickable ? "button" : "div");
            info.className = "fwinfo";
            if (clickable) info.type = "button";
            if (flashState.mode === "file") {
                info.addEventListener("click", () => fileInput.click());
            } else if (canDownload) {
                info.addEventListener("click", downloadCompiled);
            }
            bar.appendChild(info);
        }
        const clr = document.createElement("button");
        clr.type = "button";
        clr.className = "fwclear";
        clr.textContent = "清空";
        clr.addEventListener("click", clearFw);
        const go = document.createElement("button");
        go.type = "button";
        go.className = "fwgo";
        bar.appendChild(clr);
        bar.appendChild(go);
        applyGo = () => {
            const s = goState();
            if (info) {
                info.textContent = fwSummary() + (canDownload ? "  ↓" : "");
                info.title = flashState.mode === "file"
                    ? (flashState.file ? "点击重选固件" : "点击选择 .bin 固件")
                    : (canDownload ? "点击下载固件" : "");
            }
            clr.disabled = !canClear();
            go.textContent = s.label;
            go.disabled = s.off;
            go.onclick = s.off ? null : s.act;   // 用 onclick 属性，反复刷新不会叠加监听
        };
        applyGo();
        pick.appendChild(bar);

        // 「已编译成功」卡：点一下展开/收起下面的 bin 卡（不再直接下载）
        const msgBtn = $("compileMsg");
        if (msgBtn) {
            msgBtn.onclick = (flashState.mode === "auto" && flashState.compiled && compiledFresh())
                ? () => { flashState.binOpen = !flashState.binOpen; renderFlashPick(); }
                : null;
        }

        // 有了固件才谈得上推送：OTA 行放在「开始编译 / 开始烧录」下面
        // 编译成功后：三张 bin 卡 → 选中后出「下载 / 烧录 / OTA」→ OTA 再展开 IP 行
        if (flashState.mode === "auto" && flashState.compiled && compiledFresh() && flashState.binOpen) {
            const bins = $("csBins");
            if (bins) { pick.appendChild(bins); paintBinPick(); }

            const acts = document.createElement("div");
            acts.className = "pair-2";
            [["⬇", "下载", () => downloadCompiled()],
             ["⚡", "烧录", () => flashNow()]].forEach(([ico, label, fn]) => {
                const b = document.createElement("button");
                b.type = "button";
                b.className = "pair-btn" + (label === "OTA" && flashState.otaOpen ? " on" : "");
                b.textContent = label;
                b.addEventListener("click", fn);
                acts.appendChild(b);
            });
            pick.appendChild(acts);
        }
    }

    // 「擦除」工具卡：选中即整卡高亮（不改文案，不加 ✓）
    function renderErase() {
        const b = $("eraseToggle");
        if (!b) return;
        b.textContent = "擦除";
        b.classList.toggle("on", !!flashState.erase);
    }

    /* ===== 烧录执行：esptool-js 直接驱动串口，全程只在卡片里 =====
       流程：申请串口 → 载入引擎 → 连接/识别芯片 →（可选）整片擦除 → 写入 → 复位。
       进度、错误、日志都渲染在 #dlgMirror / #flashLog 里，页面上没有任何原生弹窗。 */
    let flashUi = null;   // 当前进度面板

    function sleepMs(ms) { return new Promise(r => setTimeout(r, ms)); }

    // 卡片内的进度面板：标题 + 说明 + 进度条 + 按钮
    function flashPanel(title, sub, opts) {
        const o = opts || {};
        const m = $("dlgMirror");
        m.hidden = false;
        m.innerHTML = "";
        const t = document.createElement("div");
        t.className = "dm-title";
        t.textContent = title;
        m.appendChild(t);
        let sEl = null;
        if (sub) {
            sEl = document.createElement("div");
            sEl.className = "dm-sub";
            sEl.textContent = sub;
            m.appendChild(sEl);
        }
        let fill = null;
        if (o.progress) {
            const bar = document.createElement("div");
            bar.className = "dlg-prog";
            fill = document.createElement("i");
            bar.appendChild(fill);
            m.appendChild(bar);
        }
        return {
            setTitle: v => { t.textContent = v; },
            setSub: v => { if (sEl) sEl.textContent = v; },
            setPct: v => { if (fill) fill.style.width = Math.max(0, Math.min(100, v)) + "%"; },
            acts: list => {
                const row = document.createElement("div");
                row.className = "dm-btns";
                list.forEach(a => {
                    const b = document.createElement("button");
                    b.type = "button";
                    b.className = "cs-btn" + (a.main ? " main" : "");
                    b.textContent = a.label;
                    b.addEventListener("click", a.fn);
                    row.appendChild(b);
                });
                m.appendChild(row);
            }
        };
    }

    // 回到「选固件」状态
    function flashIdle() {
        flashUi = null;
        const m = $("dlgMirror");
        m.hidden = true;
        m.innerHTML = "";
        if (flashCardOpen) renderFlashPick();
    }

    // 固件就绪后触发烧录：requestPort 必须落在用户手势里，所以这里同步发起
    async function flashNow() {
        if (flashRunning) { showToast("正在烧录，请等它写完", 3000); return; }
        if (monActive) { flashLog("WARN 串口被监视器占用，先点监视器旁的「断开」"); showToast("串口被监视器占用，请先在卡片里点「断开」", 5000); return; }
        if (!flashFirmwareUrl()) { flashLog("WARN 还没有可烧录的固件"); showToast("还没有可烧录的固件，请先编译或选择固件", 4000); return; }
        // 编译产物和当前配置不一致（改过设备名/引脚/配对码）时拒绝烧录，避免把旧固件刷进去
        if (flashState.mode === "auto" && !compiledFresh()) {
            flashState.err = "";
            flashLog("WARN 配置已修改，编译产物已过期，已阻止烧录");
            showToast("配置改过了，固件已过期，请重新编译", 5000);
            renderFlashPick();
            return;
        }
        const sup = flashSupport();
        if (!sup.ok) { flashLog("ERROR " + sup.why); showToast(sup.why, 6000); return; }

        flashRunning = true;
        $("compileStatus").classList.add("show");
        $("btnFlash").classList.add("on");
        $("flashPick").hidden = true;
        $("monBox").hidden = true;
        $("flashLog").hidden = false;
        // 烧录期间只留进度面板：编译态的结论行（含下载/烧录/取消按钮）整行收起，避免重复提示
        $("csRow").hidden = true;
        const msg = $("compileMsg");
        msg.textContent = "等待串口授权…";
        flashUi = flashPanel("等待串口授权…", "在浏览器的串口选择框里选中设备；点取消就回到卡片重新开始。", {});
        flashLog("发起烧录：等待串口授权…");

        let port;
        try {
            port = await navigator.serial.requestPort();
        } catch (e) {
            flashRunning = false;
            if (e && e.name === "NotFoundError") flashLog("已取消：没有选择串口");
            else {
                flashLog("ERROR 串口授权失败：" + ((e && e.message) || e));
                showToast("串口授权失败：" + ((e && e.message) || e), 5000);
            }
            flashIdle();
            return;
        }

        try {
            await runFlash(port, msg);
        } catch (e) {
            // runFlash 内部已兜底，这里只防极端情况下把异常抛到点击事件外面
            flashLog("ERROR " + ((e && e.message) || e));
            showToast("烧录异常：" + ((e && e.message) || e), 6000);
        } finally {
            flashRunning = false;
        }
    }

    async function runFlash(port, msg) {
        // 这里重建面板：授权阶段没有进度条，写入阶段需要
        const panel = flashPanel("准备烧录…", "正在读取固件…", { progress: true });
        flashUi = panel;
        let transport = null;
        let loader = null;
        let lastPct = -1;
        const status = (title, sub, pct) => {
            panel.setTitle(title);
            if (sub != null) panel.setSub(sub);
            if (pct != null) panel.setPct(pct);
            if (msg) msg.textContent = title;
        };
        try {
            const blob = await flashFirmwareBlob();
            if (!blob || !blob.size) throw new Error("没有可用的固件");
            const data = new Uint8Array(await blob.arrayBuffer());
            // 固件自己是给哪种芯片的：本地 / 直链固件不归本页编译，只能从镜像里认
            const img = imageInfo(data);
            flashLog(img.family
                ? "固件芯片：" + (img.model || (img.family === "esp32" ? "ESP32" : "ESP8266"))
                : "WARN 没认出固件属于哪种芯片");

            status("加载烧录引擎…", "首次使用需要下载约 200 KB，之后走缓存。");
            const lib = await loadEsptool();
            transport = new lib.Transport(port);
            loader = new lib.ESPLoader({ transport, baudrate: 115200, enableTracing: false });

            status("连接设备…", "正在打开串口并握手，几秒内完成；一直停在这里就拔插 USB 再试。");
            flashLog("初始化串口连接…");
            await loader.main();
            const chipName = loader.chip && loader.chip.CHIP_NAME ? String(loader.chip.CHIP_NAME) : "";
            if (chipName) flashLog("已连接：" + chipName);
            try { await loader.flashId(); } catch (e) { /* 读芯片 ID 失败不影响写入 */ }
            // 写之前三道比对（任何一道不过都不擦除、不写入，复位后直接断开）：
            //   1. 固件芯片族 vs 实际芯片族（本地 / 直链 / 编译产物一律适用）
            //   2. ESP32 内部型号（S3 的固件插到 C3 上也会起不来）
            //   3. 编译产物和上方选的芯片不一致（防止拿到别的芯片的产物）
            //   4. 认不出固件芯片时，自动模式退回用「上方选择」比对
            const hwFam = chipFamilyOf(chipName);
            const hwId = hwChipId(chipName);
            const hwLabel = chipName || "未知芯片";
            const famName = f => f === "esp32" ? "ESP32" : "ESP8266";
            const badFam = !!(img.family && hwFam && img.family !== hwFam);
            const badModel = !badFam && img.modelId >= 0 && hwId >= 0 && img.modelId !== hwId;
            const badBuild = !badFam && !badModel && flashState.mode === "auto" && !!img.family && img.family !== state.chip;
            const badPick = !img.family && flashState.mode === "auto" && hwFam && hwFam !== state.chip;
            if (badFam || badModel || badBuild || badPick) {
                try { await transport.setRTS(true); await sleepMs(120); await loader.after(); } catch (e) { }
                let why;
                if (badFam) why = "固件是 " + famName(img.family) + " 的，插着的设备是 " + hwLabel + "，芯片不一致，已拒绝写入。";
                else if (badModel) why = "固件是 " + img.model + " 的，插着的设备是 " + hwLabel + "，型号不一致，已拒绝写入。";
                else if (badBuild) why = "编译产物是 " + famName(img.family) + " 的，上方芯片却选的是 " + famName(state.chip) + "，已拒绝写入。重新编译或改回芯片。";
                else why = "设备是 " + hwLabel + "，固件是按 " + famName(state.chip) + " 编译的，已拒绝写入。切到 " + hwLabel + " 重新编译，或插对芯片。";
                const err = new Error(why);
                err.chipMismatch = true;
                throw err;
            }
            if (!img.family) flashLog("WARN 认不出固件芯片，按上方选择继续；本地/直链固件请自行确认来源");

            if (flashState.erase) {
                status("擦除设备…", "正在整片擦除，大容量 Flash 可能要几十秒。", 0);
                flashLog("整片擦除 Flash…");
                await loader.eraseFlash();
                flashLog("擦除完成");
            }

            status("写入中 0%", "请勿断开 USB、不要关闭页面。", 0);
            flashLog("开始写入固件（" + fmtSize(data.length) + "）");
            await loader.writeFlash({
                fileArray: [{ data: data, address: 0 }],
                flashSize: "keep",
                flashMode: "keep",
                flashFreq: "keep",
                eraseAll: false,
                compress: true,
                reportProgress: (fileIndex, written, total) => {
                    const pct = total ? Math.min(100, Math.floor((written / total) * 100)) : 0;
                    if (pct === lastPct) return;
                    lastPct = pct;
                    status("写入中 " + pct + "%", "请勿断开 USB、不要关闭页面。", pct);
                    if (pct > 0 && pct % 20 === 0) flashLog("写入 " + pct + "%");
                }
            });

            status("重启设备…", "写入完成，正在复位。", 100);
            flashLog("写入完成，复位设备…");
            try {
                await transport.setRTS(true);
                await sleepMs(120);
                await loader.after();
            } catch (e) { /* 复位失败不当作烧录失败 */ }

            flashLog("✔ 烧录完成，设备已重启");
            status("🎉 烧录完成", "设备已重启，可以拔掉 USB 了。", 100);
            if (msg) msg.textContent = "烧录完成 · 设备已重启";
            // 卡面已经是完成态，不再弹 toast（多一个不同颜色的小框和卡片打架）
            panel.acts([{ label: "完成", main: true, fn: () => { flashIdle(); closeFlashCard(); } }]);
        } catch (e) {
            const s = (e && e.message) || String(e);
            const chipBad = !!(e && e.chipMismatch);
            flashLog((chipBad ? "WARN " : "ERROR ") + (chipBad ? "芯片不匹配：" : "烧录失败：") + s);
            status(chipBad ? "⚠️ 芯片不匹配" : "❌ 烧录失败", s, 0);
            if (msg) msg.textContent = (chipBad ? "芯片不匹配：" : "烧录失败：") + s;
            panel.acts([
                { label: "重试", main: true, fn: () => { flashIdle(); flashNow(); } },
                { label: "关闭", fn: () => { flashIdle(); } }
            ]);
        } finally {
            if (transport) { try { await transport.disconnect(); } catch (e) { } }
            flashRunning = false;
        }
    }

    /* ================= 串口监视器：Web Serial 直读设备日志（输出汇入共用日志窗口） ================= */
    let monPort = null, monReader = null, monActive = false;
    let monBaudSel = 115200;   // 当前选择的波特率（连接时生效；连接中不允许改）
    let monBuf = ""; // 串口数据是按块到达的，攒到换行再成行入窗

    function monSys(s) { pushLog("sys", s); }              // 连接/断开等提示
    function monAppend(s) {                                 // 串口原始块：按行切分入窗
        monBuf += s.replace(/\r/g, "");
        let i;
        while ((i = monBuf.indexOf("\n")) > -1) {
            pushLog("serial", monBuf.slice(0, i));
            monBuf = monBuf.slice(i + 1);
        }
        // 半行先展示出来（设备日志常整块刷出，尾部可能长时间无换行）
        if (monBuf.length > 500) { pushLog("serial", monBuf); monBuf = ""; }
    }
    function monSetUI(on) {
        const b = $("monConnect");
        b.textContent = on ? "断开" : "连接";
        b.classList.toggle("main", !!on);
    }
    // 监视器随烧录卡显隐
    function renderMonBox() {
        $("monBox").hidden = !flashCardOpen;
        if (!flashCardOpen) $("monBaudOpts").hidden = true;
    }
    async function monToggle() {
        if (monActive) { // 断开
            monActive = false;
            try { if (monReader) await monReader.cancel(); } catch (e) { }
            try { if (monPort) await monPort.close(); } catch (e) { }
            monPort = null;
            monSetUI(false);
            monSys("[串口已断开]");
            return;
        }
        if (!("serial" in navigator)) { showToast("这个浏览器不支持 Web Serial，请用 Chrome / Edge"); return; }
        if (flashRunning) { showToast("烧录进行中，等它写完再开监视器"); return; }
        try {
            monPort = await navigator.serial.requestPort();
            await monPort.open({ baudRate: monBaudSel });
        } catch (e) {
            monPort = null;
            if (e && e.name === "NotFoundError") return; // 用户取消了端口选择
            const s = String((e && e.message) || e);
            if (/open/i.test(s) && /serial/i.test(s)) showToast("串口打开失败：先关掉烧录窗口/其他占用程序，拔插 USB 再试", 6000);
            else showToast("打开失败：" + s, 5000);
            return;
        }
        monActive = true;
        monBuf = "";
        $("monBaudOpts").hidden = true;
        monSetUI(true);
        monSys("[串口已连接 · " + monBaudSel + " 波特率，无输出按一下板上 RST]");
        monLoop();
    }
    async function monLoop() {
        const dec = new TextDecoder();
        while (monActive && monPort && monPort.readable) {
            const reader = monPort.readable.getReader();
            monReader = reader;
            try {
                for (; ;) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    if (value && value.length) monAppend(dec.decode(value, { stream: true }));
                }
            } catch (e) {
                if (monActive) monSys("[串口读取中断] " + ((e && e.message) || e));
                break;
            } finally {
                monReader = null;
                try { reader.releaseLock(); } catch (e) { }
            }
        }
    }

    // 波特率：点工具卡在下面弹一行选项卡（选中即生效，连接中不许改）

    function deleteTpl(id) {

        if (!t) return;
        const used = state.devices.some(d => d.type === id);
        const msg = "删除整机模板「" + t.name + "」？" + (used ? "\n已添加的这台整机会一并移除。" : "") + "\n删除后不可恢复。";

    function showTplEditor(tpl) {
        tplDraft = tpl ? JSON.parse(JSON.stringify(tpl))
            : { id: "tpl_" + Date.now().toString(36), icon: "📦", name: "", sub: "", vars: [], yaml: "" };
        $("tpName").value = tplDraft.name || "";
        $("tpIcon").value = tplDraft.icon || "📦";
        $("tpSub").value = tplDraft.sub || "";
        $("tpYaml").value = tplDraft.yaml || "";
        // 用 onclick 赋值，反复打开不会叠加监听
        $("tpName").oninput = e => { tplDraft.name = e.target.value; };
        $("tpIcon").oninput = e => { tplDraft.icon = e.target.value; };
        $("tpSub").oninput = e => { tplDraft.sub = e.target.value; };
        $("tpYaml").oninput = e => { tplDraft.yaml = e.target.value; };
        $("tpScan").onclick = () => { tplDraft.yaml = $("tpYaml").value; scanTplVars(); renderTplVars(); };
        // 把 YAML 里写死的 GPIO 变成引脚参数：GPIO0 → {{pin_gpio0}}，默认值仍是 GPIO0
        $("tpPins").onclick = () => {
            const ta = $("tpYaml");
            const seen = {};
            const next = ta.value.replace(/GPIO(\d+)/g, (m, n) => {
                const k = "pin_gpio" + n;
                seen[k] = "GPIO" + n;
                return "{{" + k + "}}";
            });
            const pinMsg = $("tpPinMsg");
            if (!Object.keys(seen).length) {
                pinMsg.textContent = "这份 YAML 里没有 GPIO0 这种写死的引脚（或已经转过）";
                return;
            }
            pinMsg.textContent = "已转成 " + Object.keys(seen).length + " 个引脚参数，记得点「保存模板」";
            ta.value = next;
            tplDraft.yaml = next;
            scanTplVars();
            (tplDraft.vars || []).forEach(v => {
                if (seen[v.key] && !v.def) v.def = seen[v.key];
                if (seen[v.key]) v.type = "pin";
            });
            renderTplVars();
        };
        $("tpSave").onclick = saveTplDraft;
        $("tpCancel").onclick = closeTplEditor;
        // 云端保存口令：本机没有时显示这张卡，填一次就记住
        $("tplKeyCard").hidden = !!tplCloudKey();
        $("tpKey").value = "";
        $("tpKeyMsg").textContent = "";
        $("tpKey").oninput = () => { };   // 只点了「设为同步口令」或保存成功才记住
        $("tpKeySet").onclick = async () => {
            const next = ($("tpKey").value || "").trim();
            const msg = $("tpKeyMsg");
            if (next.length < 4) { msg.textContent = "口令至少 4 位"; return; }
            msg.textContent = "设置中…";
            try {
                const r = await window.fetch(window.__API_BASE + "/api/tpl/pass", {
                    method: "POST",
                    headers: { "content-type": "application/json" },
                    body: JSON.stringify({ old: tplCloudKey(), next: next })
                });
                if (r.ok) {
                    try { localStorage.setItem(TPL_KEY_STORE, next); } catch (e) { }
                    $("tplKeyCard").hidden = true;
                    flashPlusCard("已设置同步口令");
                } else if (r.status === 403) {
                    msg.textContent = "原口令不对：先填当前口令再改";
                } else if (r.status === 400) {
                    msg.textContent = "口令太短";
                } else {
                    msg.textContent = "设置失败";
                }
            } catch (e) { msg.textContent = "连不上服务器"; }
        };
        renderTplVars();
        hideSheets();
        $("tplAddRow").hidden = true;
        const ed = $("tplEditor");
        ed.hidden = false;
        if (ed.scrollIntoView) ed.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
    function scanTplVars() {
        const found = [];
        const re = /\{\{\s*([A-Za-z0-9_.-]+)\s*\}\}/g;
        let m;
        while ((m = re.exec(tplDraft.yaml || ""))) {
            const k = m[1];
            if (CM_TPL_BUILTIN_VARS[k]) continue;
            if (!found.includes(k)) found.push(k);
        }
        const old = tplDraft.vars || [];
        tplDraft.vars = found.map(k => old.find(v => v.key === k) || { key: k, label: k, type: /pin/i.test(k) ? "pin" : "text", def: "" });
    }

    function renderTplVars() {
        const box = $("tpVarBox"); if (!box) return;
        box.innerHTML = "";
        const vars = tplDraft.vars || [];
        if (!vars.length) {
            box.innerHTML = '<div class="tpl-note">未检测到自定义占位符</div>';
            return;
        }
        const t = document.createElement("div"); t.className = "tpl-sec-title"; t.textContent = "自定义参数（" + vars.length + "）";
        box.appendChild(t);
        vars.forEach(v => {
            const row = document.createElement("div"); row.className = "tpl-var-row";
            const k = document.createElement("div"); k.className = "vk"; k.textContent = "{{" + v.key + "}}"; k.title = v.key;
            const sel = document.createElement("select"); sel.className = "form-select";
            [["text", "文本"], ["number", "数字"], ["pin", "引脚"]].forEach(([val, lab]) => {
                const o = document.createElement("option"); o.value = val; o.textContent = lab;
                if (v.type === val) o.selected = true; sel.appendChild(o);
            });
            sel.addEventListener("change", e => { v.type = e.target.value; });
            const inp = document.createElement("input"); inp.className = "form-input";
            inp.placeholder = "默认值"; inp.value = v.def == null ? "" : v.def;
            inp.addEventListener("input", e => { v.def = e.target.value; });
            row.appendChild(k); row.appendChild(sel); row.appendChild(inp);
            box.appendChild(row);
        });
    }

    function saveTplDraft() {
        const name = ($("tpName").value || "").trim();
        let yml = $("tpYaml").value || "";
        if (!name) { showToast("请填写模板名称"); return; }
        if (!yml.trim()) { showToast("请粘贴完整 YAML"); return; }
        const old = state.cmTemplates.find(t => t.id === tplDraft.id);
        const oldName = old ? old.name : "";
        tplDraft.name = name;
        // 没有任何自定义占位符、但 YAML 里写死了 GPIOx：自动转成引脚参数。
        // 这样粘一份现成配置保存后，设备设置页就能逐个改引脚（默认值仍是原脚，生成结果不变）
        const hasCustom = /\{\{\s*[A-Za-z0-9_.-]+\s*\}\}/.test(
            yml.replace(/\{\{\s*(deviceName|node_name|board|chip|flash|wifi_ssid|wifi_pass|hk_code)\s*\}\}/g, "")
        );
        const autoPins = {};
        if (!hasCustom && /GPIO\d+/.test(yml)) {
            yml = yml.replace(/GPIO(\d+)/g, (m, n) => {
                const k = "pin_gpio" + n;
                autoPins[k] = "GPIO" + n;
                return "{{" + k + "}}";
            });
            $("tpYaml").value = yml;
        }
        tplDraft.yaml = yml;
        tplDraft.icon = ($("tpIcon").value || "").trim() || "📦";
        scanTplVars();
        (tplDraft.vars || []).forEach(v => {
            if (autoPins[v.key]) { v.type = "pin"; if (!v.def) v.def = autoPins[v.key]; }
        });
        const i = state.cmTemplates.findIndex(t => t.id === tplDraft.id);
        if (i >= 0) state.cmTemplates[i] = tplDraft; else state.cmTemplates.push(tplDraft);
        if (!saveCmTemplates()) return;
        // 口令卡里填了就直接记住（不用先点「设为同步口令」）
        const typedKey = ($("tpKey").value || "").trim();
        if (typedKey && !tplCloudKey()) {
            try { localStorage.setItem(TPL_KEY_STORE, typedKey); } catch (e) { }
        }
        pushTplCloud();
        // 已添加的这台整机：名称跟着模板改，配置立即生效
        const dev = state.devices.find(d => d.type === tplDraft.id);
        if (dev && (!oldName || dev.name === oldName)) dev.name = tplDraft.name;
        showToast(dev ? "✅ 已保存，已添加的整机同步更新" : (tplCloudKey() ? "✅ 已保存，已同步到云端" : "✅ 已保存，仅存本机"));
        renderTypes(); renderDevices();
        $("tplEditor").hidden = true;
        if (tplBackFn) closeTplEditor(); else hideSheets();
    }

    // 「＋ 添加整机模板」卡里临时显示一句提示，3 秒后还原（不弹 toast）

    function exportTpl() {
        if (!state.cmTemplates.length) { flashPlusCard("还没有可导出的模板"); return; }
        const data = JSON.stringify({ type: "esphome-cm-templates", version: 1, templates: state.cmTemplates }, null, 2);
        const blob = new Blob([data], { type: "application/json;charset=utf-8" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "esphome-cm-templates.json";
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 1000);
        showToast("⬇️ 已导出模板备份");
    }

    function importTpl() {
        const inp = document.createElement("input");
        inp.type = "file"; inp.accept = ".json,application/json";
        inp.onchange = () => {
            const f = inp.files && inp.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = () => {
                try {
                    const d = JSON.parse(String(r.result));
                    const arr = Array.isArray(d) ? d : (d && d.templates) || [];
                    let n = 0;
                    arr.forEach(t => {
                        if (!t || !t.name || typeof t.yaml !== "string") return;
                        const id = (t.id && !CM_TYPES[t.id] && !cmDef(t.id)) ? t.id : "tpl_" + Math.random().toString(36).slice(2, 8);
                        const item = { id: id, icon: t.icon || "📦", name: t.name, sub: t.sub || "", chip: t.chip || "",
                                       node: t.node || "", file: t.file || "",
                                       vars: Array.isArray(t.vars) ? t.vars : [], yaml: t.yaml };
                        const i = state.cmTemplates.findIndex(x => x.name === item.name);
                        if (i >= 0) { item.id = state.cmTemplates[i].id; state.cmTemplates[i] = item; }
                        else state.cmTemplates.push(item);
                        n++;
                    });
                    if (!n) { showToast("文件里没有可用的模板"); return; }
                    saveCmTemplates(); pushTplCloud(); renderTypes(); hideSheets();
                    showToast("已导入 " + n + " 个模板");
                } catch (e) { showToast("❌ 文件格式不正确"); }
            };
            r.readAsText(f);
        };
        inp.click();
    }
