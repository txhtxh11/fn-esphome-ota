        "yaml": "# ============================================================\n# ORVIBO S30C · 最小底座固件（无 HomeKit / 无巴法云）\n# 用途：OTA 前置——先把设备刷成这版腾出空间，再刷目标固件\n# 体积：约 370 KB（OTA 上限约 520 KB）\n# 包含：WiFi + 断网热点配网 + Web 网页 + OTA\n# ============================================================\n\nesphome:\n  name: \"{{node_name}}\"\n  friendly_name: \"{{deviceName}}\"\n  name_add_mac_suffix: true\n  on_boot:\n    priority: 800\n    then:\n      - lambda: |-\n          WiFi.setPhyMode(WIFI_PHY_MODE_11G);\n  platformio_options:\n    board_build.f_cpu: 160000000L\n    board_build.ldscript: eagle.flash.1m.ld\n\nesp8266:\n  board: esp01_1m\n  restore_from_flash: true\n\nwifi:\n  min_auth_mode: WPA2\n  power_save_mode: none\n  ssid: \"{{wifi_ssid}}\"\n  password: \"{{wifi_pass}}\"\n  reboot_timeout: 0s\n  ap:\n    ssid: \"ESPHOME-Hotspot\"\n    password: \"\"\n\ncaptive_portal:\n\nlogger:\n  level: INFO\n\nota:\n  - platform: esphome\n\nweb_server:\n  port: 80\n  version: 1\n"
    },
    {
        "id": "tpl_orvibo_hk",
        "icon": "🏠",
        "name": "orvibo 无巴法",
        "sub": "HomeKit 全功能 · 配对用",
        "chip": "esp8266",
        "node": "orvibo",
        "vars": [],
        "yaml": "# ============================================================\n# ORVIBO S30C · 全功能固件（HomeKit 单协议，无巴法云）\n#\n# 【为什么先刷这一版】\n# HomeKit 配对要做 SRP-3072 大数运算，ESP8266 上会阻塞主循环 14 秒以上\n# （实测日志：coroutine took a long time for an operation (14491 ms)）。\n# 同时开 MQTT 会额外吃内存与网络，iOS 等不到响应 -> \"连接丢失\"。\n# 所以正确顺序是：\n#   ① 刷本版（无 MQTT）→ 在家庭 App 完成配对\n#   ② 再刷带巴法云的版本 → 配对信息存在 NVS，OTA 不会清除\n#\n# 体积：约 508 KB\n# 包含：HomeKit + Web 网页 + API + 日志 + 长按两档 + 恢复出厂\n# ============================================================\n\nesphome:\n  name: \"{{node_name}}\"\n  friendly_name: \"{{deviceName}}\"\n  name_add_mac_suffix: true\n  on_boot:\n    priority: 800\n    then:\n      - lambda: |-\n          WiFi.setPhyMode(WIFI_PHY_MODE_11G);\n  platformio_options:\n    board_build.f_cpu: 160000000L\n    board_build.ldscript: eagle.flash.1m.ld\n    build_flags:\n      - \"-D HOMEKIT_LOG_LEVEL=0 -D ARDUINO_HOMEKIT_LOWROM\"\n\nesp8266:\n  board: esp01_1m\n  restore_from_flash: true\n\nwifi:\n  min_auth_mode: WPA2\n  power_save_mode: none\n  ssid: \"{{wifi_ssid}}\"\n  password: \"{{wifi_pass}}\"\n  reboot_timeout: 0s\n  on_connect:\n    - switch.turn_off: relay_3\n  on_disconnect:\n    - switch.turn_on: relay_3\n  ap:\n    ssid: \"ESPHOME-Hotspot\"\n    password: \"\"\n\ncaptive_portal:\n\nlogger:\n  level: INFO\n\napi:\n  reboot_timeout: 0s\n\nota:\n  - platform: esphome\n\nweb_server:\n  port: 80\n  version: 1\n  log: true\n\nexternal_components:\n  - source:\n      type: git\n      url: https://github.com/txhtxh11/homekit\n      path: homekit-esp8266\n    refresh: 7d\n    components: [homekit]\n\nswitch:\n  - platform: gpio\n    id: relay_1\n    name: \"orvibo\"\n    pin:\n      number: GPIO5\n    restore_mode: ALWAYS_OFF\n    on_turn_on:\n      - switch.turn_on: relay_2\n    on_turn_off:\n      - switch.turn_off: relay_2\n\n  - platform: gpio\n    id: relay_2\n    name: \"GPIO4 Output\"\n    pin:\n      number: GPIO4\n    restore_mode: ALWAYS_OFF\n\n  - platform: gpio\n    id: relay_3\n    name: \"Network Status LED (GPIO12)\"\n    pin:\n      number: GPIO12\n    restore_mode: ALWAYS_OFF\n\n  - platform: factory_reset\n    id: wipe_all\n    name: \"恢复出厂设置\"\n    internal: true\n\nbinary_sensor:\n  - platform: gpio\n    id: button_1\n    name: \"Physical Button (GPIO14)\"\n    pin:\n      number: GPIO14\n      mode: INPUT_PULLUP\n      inverted: true\n    on_click:\n      min_length: 50ms\n      max_length: 350ms\n      then:\n        - switch.toggle: relay_1\n    on_multi_click:\n      - timing:\n          - ON for at least 10s\n        then:\n          - switch.turn_on: wipe_all\n      - timing:\n          - ON for at least 5s\n          - OFF for at least 0.1s\n        then:\n          - homekit.reset_storage:\n              id: my_hk\n\nhomekit:\n  id: my_hk\n  setup_code: \"111-22-333\"\n  switches:\n    - relay_1\n  binary_sensors:\n    - id: button_1\n      type: contact\n\nbutton:\n  - platform: template\n    name: \"重置 HomeKit 配对\"\n    id: reset_homekit_btn\n    icon: \"mdi:restart-alert\"\n    on_press:\n      - homekit.reset_storage: my_hk\n\ntext_sensor:\n  - platform: template\n    name: \"HomeKit 配对码状态\"\n    id: hk_setup_text_sensor\n    update_interval: 12h\n    lambda: |-\n      std::string code = id(my_hk)->get_setup_code();\n      if (code.empty()) return std::string(\"等待生成中\");\n      return code;\n"
    },
    {
        "id": "tpl_orvibo_dual",
        "icon": "📡",
        "name": "orvibo 双协议",
        "sub": "HomeKit + 巴法云",
        "chip": "esp8266",
        "node": "orvibo",
        "vars": [],
        "yaml": "# ============================================================\n# ORVIBO S30C · 双协议固件（HomeKit + 巴法云 MQTT）\n#\n# 【双协议方案说明】\n# 1) 配对必须在「无 MQTT」的固件上完成：\n#    HomeKit 配对要做 SRP-3072 大数运算，ESP8266 实测阻塞主循环 14.5 秒；\n#    同时跑 MQTT 会挤内存和网络，iOS 等不到响应就报 \"连接丢失\"。\n# 2) 配对信息存在 NVS，OTA 不会清除，所以顺序是：\n#    刷「无巴法全功能版」→ 配对成功 → 再刷本版 → 配对保留，巴法云同时可用。\n# 3) HomeKit 与巴法云各自独立控制同一个继电器，互不依赖：\n#    - 苹果家庭：走 HAP，局域网直连，无需外网\n#    - 巴法云：走 MQTT（bemfa.com:9501），手机在外网也能控制\n# 4) 主题命名规则：<设备名><序号><类型码>，全字母数字（巴法只收字母数字）\n#    本设备：orvibo1006（006 = 开关）\n#\n# 体积：约 505 KB（OTA 镜像 509 KB，上限约 520 KB）\n# 注意：本版不含 logger，网页 Debug Log 无输出\n# ============================================================\n\nesphome:\n  name: \"{{node_name}}\"\n  friendly_name: \"{{deviceName}}\"\n  name_add_mac_suffix: true\n  on_boot:\n    priority: 800\n    then:\n      - lambda: |-\n          WiFi.setPhyMode(WIFI_PHY_MODE_11G);\n  platformio_options:\n    board_build.f_cpu: 160000000L\n    board_build.ldscript: eagle.flash.1m.ld\n    build_flags:\n      - \"-D HOMEKIT_LOG_LEVEL=0 -D ARDUINO_HOMEKIT_LOWROM\"\n\nesp8266:\n  board: esp01_1m\n  restore_from_flash: true\n\nwifi:\n  min_auth_mode: WPA2\n  power_save_mode: none\n  ssid: \"{{wifi_ssid}}\"\n  password: \"{{wifi_pass}}\"\n  reboot_timeout: 0s\n  on_connect:\n    - switch.turn_off: relay_3\n  on_disconnect:\n    - switch.turn_on: relay_3\n  ap:\n    ssid: \"ESPHOME-Hotspot\"\n    password: \"\"\n\ncaptive_portal:\n\nota:\n  - platform: esphome\n\nweb_server:\n  port: 80\n  version: 1\n\nexternal_components:\n  - source:\n      type: git\n      url: https://github.com/txhtxh11/homekit\n      path: homekit-esp8266\n    refresh: 7d\n    components: [homekit]\n\n# ↓ 把三处 PASTE_YOUR_BEMFA_UID 换成你自己的巴法云私钥（控制台首页可见）\nmqtt:\n  broker: bemfa.com\n  port: 9501\n  username: \"PASTE_YOUR_BEMFA_UID\"\n  password: \"PASTE_YOUR_BEMFA_UID\"\n  client_id: \"PASTE_YOUR_BEMFA_UID\"\n  topic_prefix: \"esphome_bridge\"\n  discovery: false\n  on_connect:\n    - mqtt.publish:\n        topic: orvibo1006/set\n        payload: !lambda 'return id(relay_1).state ? \"on\" : \"off\";'\n  on_message:\n    - topic: orvibo1006\n      then:\n        - lambda: |-\n            if (x == \"on\") { id(relay_1).turn_on(); }\n            else if (x == \"off\") { id(relay_1).turn_off(); }\n\nswitch:\n  - platform: gpio\n    id: relay_1\n    name: \"orvibo\"\n    pin:\n      number: GPIO5\n    restore_mode: ALWAYS_OFF\n    on_turn_on:\n      - switch.turn_on: relay_2\n      - mqtt.publish:\n          topic: orvibo1006/set\n          payload: \"on\"\n    on_turn_off:\n      - switch.turn_off: relay_2\n      - mqtt.publish:\n          topic: orvibo1006/set\n          payload: \"off\"\n\n  - platform: gpio\n    id: relay_2\n    name: \"GPIO4 Output\"\n    pin:\n      number: GPIO4\n    restore_mode: ALWAYS_OFF\n\n  - platform: gpio\n    id: relay_3\n    name: \"Network Status LED (GPIO12)\"\n    pin:\n      number: GPIO12\n    restore_mode: ALWAYS_OFF\n\n  - platform: factory_reset\n    id: wipe_all\n    name: \"恢复出厂设置\"\n    internal: true\n\nbinary_sensor:\n  - platform: gpio\n    id: button_1\n    name: \"Physical Button (GPIO14)\"\n    pin:\n      number: GPIO14\n      mode: INPUT_PULLUP\n      inverted: true\n    on_click:\n      min_length: 50ms\n      max_length: 350ms\n      then:\n        - switch.toggle: relay_1\n    on_multi_click:\n      - timing:\n          - ON for at least 10s\n        then:\n          - switch.turn_on: wipe_all\n      - timing:\n          - ON for at least 5s\n          - OFF for at least 0.1s\n        then:\n          - homekit.reset_storage:\n              id: my_hk\n\nhomekit:\n  id: my_hk\n  setup_code: \"111-22-333\"\n  switches:\n    - relay_1\n  binary_sensors:\n    - id: button_1\n      type: contact\n\nbutton:\n  - platform: template\n    name: \"重置 HomeKit 配对\"\n    id: reset_homekit_btn\n    icon: \"mdi:restart-alert\"\n    on_press:\n      - homekit.reset_storage: my_hk\n"
    }
];

    const TPL_KEY_STORE = "eh-tpl-key";   // 云端保存口令（本机记住，换设备重填一次）

    function tplCloudKey() {
        try { return localStorage.getItem(TPL_KEY_STORE) || ""; } catch (e) { return ""; }
    }

    // 整份列表覆盖写到 KV；没口令就静默跳过（本地照样存）
    function pushTplCloud() {
        const key = tplCloudKey();
        if (!key || typeof window.fetch !== "function") return;
        window.fetch(window.__API_BASE + "/api/tpl", {
            method: "POST",
            headers: { "content-type": "application/json", "x-tpl-key": key },
            body: JSON.stringify({ templates: state.cmTemplates })
        }).then(r => {
            if (r.status === 403) {
                try { localStorage.removeItem(TPL_KEY_STORE); } catch (e) { }
                flashPlusCard("同步口令不对");
            }
        }).catch(() => { });
    }

    // 打开页面时把云端模板合并进来（本地同名/同 id 的优先，避免覆盖刚改的）
    function pullTplCloud() {
        if (typeof window.fetch !== "function") return;
        window.fetch(window.__API_BASE + "/api/tpl", { cache: "no-store" })
            .then(r => (r.ok ? r.json() : null))
            .then(d => {
                if (!d || !Array.isArray(d.templates) || !d.templates.length) return;
                const byId = new Map();
                d.templates.forEach(t => byId.set(t.id, t));
                (state.cmTemplates || []).forEach(t => byId.set(t.id, t));
                const merged = [...byId.values()];
                if (merged.length === (state.cmTemplates || []).length) return;
                state.cmTemplates = merged;
                try { localStorage.setItem(CM_TPL_STORE, JSON.stringify(merged)); } catch (e) { }
                renderTypes();
            })
            .catch(() => { });
    }

    // 模板内置占位符：不用用户配置，生成时自动替换
    const CM_TPL_BUILTIN_VARS = {
        deviceName: "设备名（详情页改）",
        node_name: "节点名 node_name",
        board: "板型 ID",
        chip: "esp8266 / esp32",
        flash: "FLASH 大小",
        wifi_ssid: "WiFi 名称",
        wifi_pass: "WiFi 密码",
        hk_code: "HomeKit 配对码（8 位数字）"
    };

    const EVENT_LABELS = { on_turn_on: "打开时", on_turn_off: "关闭时", on_press: "触发时", on_release: "恢复时", on_state: "触发" };
    const OP_LABELS = { turn_on: "打开", turn_off: "关闭", toggle: "切换" };
    
    const BTN_ACTION_LABELS = {
        none: "（不动作）",
        toggle_slave: "切换分路",
        toggle_master: "切换总开关",
        factory_reset: "恢复出厂",
        restart: "重启系统"
    };

    // CMPOWER W1 整机内部的引脚互斥表：同一颗脚不能同时承担两个功能，否则生成的 YAML 非法
    const CM_PIN_LABELS = {
        masterPin: "总控继电器", slavePin: "分控继电器", enablePin: "继电器使能",
        buttonPin: "面板按键", ledBluePin: "WiFi 状态灯", ledRedPin: "系统状态灯",
        ledWhitePin: "分控指示灯", uartTx: "UART TX", uartRx: "UART RX"
    };

    const state = {
        chip: "esp8266",
        board: { esp8266: "nodemcuv2", esp32: "esp32dev" },
        customBoard: { esp8266: "", esp32: "" },
        flash: { esp8266: "4MB", esp32: "4MB" },
        customFlash: { esp8266: "", esp32: "" },
        wifi: { ssid: "", pass: "" },
        features: { web: true, api: true, portal: true, ota: true, restore: true },
        nodeName: "",        // esphome.name：留空 = esp_homekit_device + MAC 后缀
        friendlyName: "",    // esphome.friendly_name：留空 = ESP HomeKit 设备
        hkCode: "111-22-333",
        // 巴法云：on=生成 mqtt 段（安卓「巴法」App / 小程序直接远程控制，不依赖 HomeKit）
        bemfa: { on: false, uid: "" },
        logLevel: "INFO",   // ESPHome logger 级别：WARN / INFO / DEBUG / VERBOSE
        devices: [], seq: {}, editingUid: null,
        cmTemplates: []   // 自定义整机模板，初始化时从 localStorage 读取
    };
    const $ = (id) => document.getElementById(id);

    /* ================= 配置持久化（刷新/关页面不丢） ================= */
    const STATE_STORE = "esphk_state_v1";
    let saveTimer = null;
    function saveState() {
        try {
            const snap = {
                v: 1,
                chip: state.chip,
                board: state.board, customBoard: state.customBoard,
                flash: state.flash, customFlash: state.customFlash,
                wifi: state.wifi, hkCode: state.hkCode,
                nodeName: state.nodeName, friendlyName: state.friendlyName,
                features: state.features,
                bemfa: state.bemfa, logLevel: state.logLevel,
                seq: state.seq,
                devices: state.devices.map(d => ({
                    uid: d.uid, type: d.type, name: d.name,
                    pinOverrides: d.pinOverrides, io: d.io,
                    actions: d.actions, vars: d.vars, cfg: d.cfg
                }))
            };
            localStorage.setItem(STATE_STORE, JSON.stringify(snap));
        } catch (e) { }
    }
    // 连续改动时合并成一次写入
    function scheduleSave() {
        if (saveTimer) return;
        saveTimer = setTimeout(() => { saveTimer = null; saveState(); }, 300);
    }
    function loadState() {
        try {
            const raw = localStorage.getItem(STATE_STORE);
            if (!raw) return false;
            const s = JSON.parse(raw);
            if (!s || !Array.isArray(s.devices)) return false;
            state.chip = s.chip === "esp32" ? "esp32" : "esp8266";
            ["board", "customBoard", "flash", "customFlash", "wifi", "bemfa"].forEach(k => {
                if (s[k] && typeof s[k] === "object") Object.assign(state[k], s[k]);
            });
            if (typeof s.hkCode === "string" && s.hkCode) state.hkCode = s.hkCode;
            if (s.features && typeof s.features === "object") {
                ["web", "api", "portal", "ota", "restore"].forEach(k => {
                    if (typeof s.features[k] === "boolean") state.features[k] = s.features[k];
                });
            }
            if (typeof s.nodeName === "string") state.nodeName = s.nodeName;
            if (typeof s.friendlyName === "string") state.friendlyName = s.friendlyName;
            if (typeof s.logLevel === "string" && s.logLevel) state.logLevel = s.logLevel;
            if (s.seq && typeof s.seq === "object") state.seq = s.seq;
            state.devices = s.devices.filter(d => d && d.uid && d.type);
            return state.devices.length > 0 || !!s.v;   // 有空配置也算恢复成功
        } catch (e) { return false; }
    }

    /* ================= 整机模板持久化 ================= */
    function loadCmTemplates() {
        try {
            const raw = localStorage.getItem(CM_TPL_STORE);
            const arr = raw ? JSON.parse(raw) : [];
            if (!Array.isArray(arr)) return [];
            return arr.filter(t => t && typeof t.id === "string" && t.name && typeof t.yaml === "string")
                      .map(t => ({ id: t.id, icon: t.icon || "📦", name: t.name, sub: t.sub || "",
                                   chip: t.chip || "", node: t.node || "", file: t.file || "",
                                   vars: Array.isArray(t.vars) ? t.vars : [], yaml: t.yaml }));
        } catch (e) { return []; }
    }
    function saveCmTemplates() {
        try { localStorage.setItem(CM_TPL_STORE, JSON.stringify(state.cmTemplates)); return true; }
        catch (e) { showToast("❌ 保存失败：浏览器本地存储不可用"); return false; }
    }
    // 按 type 取整机定义（内置优先，其次自定义模板）
    function cmDef(type) {
        if (CM_TYPES[type]) return CM_TYPES[type];
        return state.cmTemplates.find(t => t.id === type) || null;
    }
    function isCmType(type) { return !!cmDef(type); }
    function cmDev() { return state.devices.find(d => isCmType(d.type)) || null; }
    // 整机模板要求的芯片（未指定则不锁定）
    function forcedChip() {
        const d = cmDev();
        if (!d) return "";
        const def = cmDef(d.type);
        return (def && (def.chip === "esp8266" || def.chip === "esp32")) ? def.chip : "";
    }

    function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
    function yamlStr(s) { return String(s).replace(/\\/g, "\\\\").replace(/"/g, '\\"'); }

    // HomeKit 配对码：取数字，不足/超出 8 位则回退默认
    function fmtHkCode(s) {
        const d = String(s || "").replace(/\D/g, "");
        return d.length === 8 ? d.slice(0,3) + "-" + d.slice(3,5) + "-" + d.slice(5) : "111-22-333";
    }
    function randomHkCode() {
        let d = String(Math.floor(Math.random() * 9) + 1); // 首位不为 0
        for (let i = 1; i < 8; i++) d += Math.floor(Math.random() * 10);
        return d.slice(0,3) + "-" + d.slice(3,5) + "-" + d.slice(5);
    }

    function currentBoardId() {
        const b = state.board[state.chip];
        if (b === "custom") return state.customBoard[state.chip] || (state.chip === "esp32" ? "esp32dev" : "esp12e");
        return b;
    }

    function nextUid(type) {
        state.seq[type] = (state.seq[type] || 0) + 1;
        let uid = type + "_" + state.seq[type];
        while (state.devices.some(d => d.uid === uid)) { state.seq[type]++; uid = type + "_" + state.seq[type]; }
        return uid;
    }

    // 是否已添加任何一个「整机」设备（内置或自定义模板）
    function hasCm() { return !!cmDev(); }

    function getPin(dev, field) {
        if (dev.pinOverrides && dev.pinOverrides[field]) return dev.pinOverrides[field];
        const t = TYPES[dev.type];
        if (!t) return "";
        if (dev.type === "bh1750") return t.defaultPins[state.chip + "_" + field];
        return t.defaultPins[state.chip] || "";
    }

    function defaultPinText(type) {
        const t = TYPES[type];
        if (!t) return "";
        if (type === "bh1750") return t.defaultPins[state.chip + "_sda"] + " / " + t.defaultPins[state.chip + "_scl"];
        return t.defaultPins[state.chip] || "";
    }

    /* ================= 引脚占用管理 ================= */
    // 空闲脚优先顺序：ESP8266 排除 GPIO15/GPIO0（启动脚，被拉高/拉低会开不了机）与 GPIO1/GPIO3（串口日志）
    const PIN_PREF_ORDER = {
        esp8266: ["GPIO5", "GPIO4", "GPIO12", "GPIO13", "GPIO14", "GPIO16", "GPIO2"],
        esp32: ["GPIO26", "GPIO27", "GPIO25", "GPIO32", "GPIO33", "GPIO4", "GPIO5", "GPIO13", "GPIO14", "GPIO15", "GPIO16", "GPIO17", "GPIO18", "GPIO19", "GPIO21", "GPIO22", "GPIO23"]
    };

    function pinFieldsOf(dev) { return dev.type === "bh1750" ? ["sda", "scl"] : ["pin"]; }

    // 返回 已占用引脚 -> 占用者名称 的映射（exceptUid 用于排除设备自身）
    function usedPinMap(exceptUid) {
        const map = new Map();
        state.devices.forEach(d => {
            if (isCmType(d.type)) return;
            if (exceptUid && d.uid === exceptUid) return;
            pinFieldsOf(d).forEach(f => {
                const p = getPin(d, f);
                if (p) map.set(p, d.name);
            });
        });
        return map;
    }

    // 同类设备默认脚相同，重复添加会撞脚（ESPHome 报 Pin X is used in multiple places）
    // 添加时若默认脚已被占用，自动改到下一个空闲脚
    function autoAssignPins(dev) {
        const map = usedPinMap(dev.uid);
        const order = (PIN_PREF_ORDER[state.chip] || []).concat(CHIP_PINS[state.chip] || []);
        pinFieldsOf(dev).forEach(f => {
            const cur = getPin(dev, f);
            if (cur && !map.has(cur)) { map.set(cur, dev.name); return; }
            const free = order.find(p => !map.has(p));
            if (free) { dev.pinOverrides[f] = free; map.set(free, dev.name); }
        });
    }

    /* ================= 渲染：芯片 ================= */
    // 通用提示：把一句话写在某张卡的副标题位置 5 秒后还原（不弹 toast）
    const cardTipTimers = new WeakMap();
    function flashCardTip(card, msg) {
        const sub = card && card.querySelector(".sub");
        if (!sub) return;
        if (!sub.dataset.orig) sub.dataset.orig = sub.textContent;
        if (cardTipTimers.has(card)) clearTimeout(cardTipTimers.get(card));
        sub.textContent = msg;
        sub.classList.add("tip");
        cardTipTimers.set(card, setTimeout(() => {
            sub.textContent = sub.dataset.orig;
            sub.classList.remove("tip");
            cardTipTimers.delete(card);
        }, 5000));
    }
    // 点芯片卡时把提示直接显示在这张卡上 5 秒，不弹扩展卡
    let chipTipTimer = null;
    function flashChipTip(id, tip) {
        const keys = Object.keys(CHIPS);
        const btns = $("chipGroup").querySelectorAll(".seg-btn");
        const btn = btns[keys.indexOf(id)];
        if (!btn) return;
        const desc = btn.querySelector(".desc");
        if (!desc) return;
        if (chipTipTimer) { clearTimeout(chipTipTimer); chipTipTimer = null; }
        btns.forEach((b, i) => {
            const d = b.querySelector(".desc");
            if (d) { d.textContent = CHIPS[keys[i]].desc; d.classList.remove("tip"); }
        });
        desc.textContent = tip;
        desc.classList.add("tip");
        chipTipTimer = setTimeout(() => {
            desc.textContent = CHIPS[id].desc;
            desc.classList.remove("tip");
            chipTipTimer = null;
        }, 5000);
    }

    function renderChips() {
        scheduleSave();        // 芯片/板型/FLASH 改动也落盘
        const el = $("chipGroup"); el.innerHTML = "";
        const locked = hasCm();
        const fc = forcedChip();
        $("chipHint").textContent = fc
            ? "已锁定 " + (fc === "esp32" ? "ESP32" : "ESP8266") + "（整机模板要求）"
            : (locked ? "整机模板未指定芯片，可自由选择" : "默认 ESP8266");
        // ESP32 现在也支持 setup_code（组件里在 hap_init 之前调用 hap_set_setup_code），配对码区块照常显示

        Object.keys(CHIPS).forEach(id => {
            const c = CHIPS[id];
            const btn = document.createElement("button");
            btn.className = "seg-btn" + (state.chip === id ? " on" : "");
            btn.innerHTML = '<span class="name">' + c.name + '</span><span class="desc">' + c.desc + '</span>';
            if (fc && id !== fc) btn.disabled = true;
            btn.addEventListener("click", () => {
                setChip(id);
                // 有提示才在卡片上闪 5 秒，不弹扩展卡
                if (c.tip) flashChipTip(id, c.tip);
            });
            el.appendChild(btn);
        });
        renderBoards();
    }

    // 板型卡片：随芯片联动，默认板型高亮并标注（默认）
    function renderBoards() {
        const el = $("boardGrid"); el.innerHTML = "";
        const locked = !!forcedChip();
        const defBoard = state.chip === "esp32" ? "esp32dev" : "nodemcuv2";
        BOARDS[state.chip].forEach(([v, label]) => {
            const isSel = state.board[state.chip] === v;
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "card board" + (isSel ? " on" : "") + (locked ? " locked" : "");
            const fl = BOARD_FLASH[v];
            btn.innerHTML = '<span class="name">' + label + (v === defBoard ? "（默认）" : "") + '</span>' +
                '<span class="sub">' + (fl ? "FLASH " + fl : "手动输入板型 ID") + '</span>';
            btn.addEventListener("click", () => {
                if (locked) { showToast("整机模板使用固定板型，不可修改"); return; }
                state.board[state.chip] = v;
                if (BOARD_FLASH[v]) {
                    state.flash[state.chip] = BOARD_FLASH[v];
                }
                renderBoards();
            });
            el.appendChild(btn);
        });
        const isCustom = state.board[state.chip] === "custom";
        $("customBoardRow").style.display = isCustom ? "" : "none";
        $("customBoardInput").value = state.customBoard[state.chip] || "";
        $("customBoardInput").disabled = !!locked;
        renderFlash(locked);
    }

    // FLASH 大小卡片：选定即高亮，随板型联动刷新；末位「自定义」只填 MB 数
    // 功能模块开关：某个模块关掉后，生成的 YAML 里对应段落直接不出现
    function feat(k) {
        if (k === "bemfa") return !!state.bemfa.on;
        return !(state.features && state.features[k] === false);
    }
    const FEATURE_LIST = [
        ["web", "Web 网页", "设备网页面板"],
        ["api", "API", "接入 Home Assistant"],
        ["portal", "配网热点", "断网自动开热点"],
        ["ota", "OTA", "空中升级"],
        ["restore", "状态记忆", "断电记住开关"],
        ["weblog", "日志", "串口与网页输出"],
        ["homekit", "HomeKit", "苹果家庭直连"],
        ["bemfa", "巴法云", "手机远程 MQTT"]
    ];
    let featOpen = false;
    // 二级块（配对码 / 巴法云 / 日志）：既要自身开关开着，也要功能模块展开
    function paintFeatureSections() {
        const hkSec = $("hkSection");
        if (hkSec) hkSec.hidden = !featOpen || !feat("homekit");
        const logSec = $("logSection");
        if (logSec) logSec.hidden = !featOpen || !feat("weblog");
        paintBemfaSection();
    }

    function renderFeatures() {
        paintFeatureSections();
        const box = $("featGrid");
        if (!box) return;
        box.innerHTML = "";
        const on = FEATURE_LIST.filter(([k]) => feat(k)).length;
        // 标题卡：点一下展开 / 收起下面的功能开关
        const head = document.createElement("button");
        head.type = "button";
        head.className = "card";   // 与上方芯片卡同高（88px）
        head.style.gridColumn = "1 / -1";
        head.innerHTML = '<span class="name">功能模块</span><span class="sub">已开 ' + on + '/' + FEATURE_LIST.length +
            (featOpen ? " · 收起" : " · 展开") + '</span>';
        head.addEventListener("click", () => { featOpen = !featOpen; renderFeatures(); });
        box.appendChild(head);
        if (!featOpen) return;
        FEATURE_LIST.forEach(([k, name, sub]) => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "card board" + (feat(k) ? " on" : "");
            b.innerHTML = '<span class="name">' + name + '</span><span class="sub">' + (feat(k) ? "开 · " + sub : "关") + '</span>';
            b.addEventListener("click", () => {
                if (k === "bemfa") {           // 巴法云有自己的开关与二级配置
                    state.bemfa.on = !state.bemfa.on;
                    bemfaSave();
                    renderBemfa();
                    renderFeatures();
                    return;
                }
                state.features[k] = !feat(k);
                scheduleSave();
                renderFeatures();
            });
            box.appendChild(b);
        });
    }

    function renderFlash(locked) {
        const el = $("flashGrid"); el.innerHTML = "";
        const cur = state.flash[state.chip] || "4MB";
        ["1MB", "2MB", "4MB", "8MB", "custom"].forEach(sz => {
            const isCustom = sz === "custom";
            const isSel = cur === sz;
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "card board" + (isSel ? " on" : "") + (locked ? " locked" : "");
            btn.innerHTML = isCustom
                ? '<span class="name">自定义</span><span class="sub">手动输入 MB</span>'
                : '<span class="name">' + sz + (sz === "4MB" ? "（默认）" : "") + '</span>' +
                  (sz === "1MB" ? '<span class="sub">OTA 上限 508 KB</span>' : '');
            btn.addEventListener("click", () => {
                if (locked) { showToast("CMPOWER 整机使用固定 FLASH，不可修改"); return; }
                state.flash[state.chip] = sz;
                renderFlash(false);
            });
            el.appendChild(btn);
        });

        // 自定义输入行：仅选中「自定义」时出现，只填 MB 数字
        const custom = cur === "custom";
        const row = $("customFlashRow");
        row.style.display = custom ? "" : "none";
        if (custom) {
            const inp = $("customFlashInput");
            inp.value = state.customFlash[state.chip] || "";
            inp.disabled = !!locked;
        }
    }

    // 自定义手填的 MB 数（无效返回 0）
    function customFlashMB() {
        const n = parseFloat(state.customFlash[state.chip]);
        return isFinite(n) && n > 0 ? n : 0;
    }

    // 实际生效的 FLASH 值，统一成 "16MB" 这种给模板占位符 / ESP32 用
    function currentFlash() {
        const chip = state.chip;
        const v = state.flash[chip] || "4MB";
        if (v !== "custom") return v;
        const mb = customFlashMB();
        return mb ? mb + "MB" : "4MB";
    }

    // ESP8266 需要 ldscript：按 MB 数换算成官方脚本名（1m/2m/4m/8m/16m，超出取最接近的可用档）
    const LDSCRIPT_BY_MB = { 1: "eagle.flash.1m.ld", 2: "eagle.flash.2m.ld", 4: "eagle.flash.4m.ld", 8: "eagle.flash.8m.ld", 16: "eagle.flash.16m.ld" };
    function currentLdscript() {
        const v = state.flash[state.chip] || "4MB";
        if (v !== "custom") return LDSCRIPT[v] || LDSCRIPT["4MB"];
        const mb = customFlashMB();
        if (!mb) return LDSCRIPT["4MB"];
        const fit = [16, 8, 4, 2, 1].find(x => mb >= x) || 1;
        return LDSCRIPT_BY_MB[fit];
    }

    function setChip(chip) {
        const fc = forcedChip();
        if (fc && chip !== fc) return;
        if (state.chip === chip) return;
        state.chip = chip;
        state.devices.forEach(d => { if (!isCmType(d.type)) d.pinOverrides = {}; });
        // 换芯片后引脚表变了，重新按顺序分配，避免回落到相同默认脚
        state.devices.forEach(d => { if (!isCmType(d.type)) autoAssignPins(d); });
        renderFeatures();
    renderChips(); renderTypes(); renderDevices();
    }

    /* ================= 渲染：卡片区 ================= */
    function renderTypes() {
        scheduleSave();
        const el = $("typeGrid"); el.innerHTML = "";
        const locked = hasCm();
        Object.keys(TYPES).forEach(type => {
            const t = TYPES[type];
            const count = state.devices.filter(d => d.type === type).length;
            const btn = document.createElement("button");
            btn.className = "card" + (count ? " on has-count" : "") + (locked ? " locked" : "");
            btn.innerHTML = '<span class="ico">' + t.icon + '</span><span class="name">' + t.name + '</span><span class="sub">' + defaultPinText(type) + '</span>' + (count ? '<span class="count">' + count + '</span>' : '');
            btn.addEventListener("click", () => {
                // 已有整机模板时通用设备不可加：提示直接写在点中的这张卡上 5 秒
                if (locked) {
                    const cmName = (cmDef(cmDev().type) || {}).name || "整机";
                    flashCardTip(btn, "已加 " + cmName + " 整机");
                    return;
                }
                addDevice(type);
            });
            el.appendChild(btn);
        });

        const cmEl = $("cmTypeGrid"); cmEl.innerHTML = "";
        // 一行两个：内置整机 + 自定义整机模板 + 末尾「＋」
        const cmList = Object.keys(CM_TYPES).map(id => Object.assign({ id: id }, CM_TYPES[id]))
            .concat(state.cmTemplates);

        // 所有整机卡共用网格最后那一行动作卡：内置整机只出「＋配置」，
        // 自定义模板出「＋配置 / 编辑 / 删除」；点同一张卡可收起
        const cmActs = document.createElement("div");
        cmActs.className = "triple cm-grid-acts";
        cmActs.style.gridColumn = "1 / -1";
        cmActs.hidden = true;
        let cmActsFor = null;
        // 选中的整机卡高亮边框
        const paintCmSel = id => {
            cmEl.querySelectorAll(".card.cm").forEach(c => c.classList.toggle("sel", !!id && c.dataset.cmId === id));
        };
        const showCmActs = def => {
            if (!cmActs.hidden && cmActsFor === def.id) { cmActs.hidden = true; cmActsFor = null; paintCmSel(null); return; }
            cmActs.innerHTML = "";
            cmActsFor = def.id;
            paintCmSel(def.id);
            const tpl = state.cmTemplates.find(t => t.id === def.id) || null;   // 内置整机没有可编辑对象
            const items = [["＋", "配置", () => {
                const ex = state.devices.find(d => d.type === def.id);
                if (ex) openDetail(ex.uid); else addDevice(def.id);
            }]];
            if (tpl) {
                items.push(["⇩", "反填", () => { hideSheets(); tplReverseApply(def); }]);
                items.push(["⇧", "回存", () => { hideSheets(); tplSaveBack(tpl); }]);
                items.push(["✎", "编辑", () => { tplBackFn = null; hideSheets(); showTplEditor(tpl); }]);
                items.push(["🗑", "删除", () => { hideSheets(); deleteTpl(tpl.id); }]);
            }
            items.forEach(([ico, label, fn, keep]) => {
                const b = document.createElement("button");
                b.type = "button";
                b.className = "cm-act-btn";
                b.innerHTML = '<span class="ico">' + ico + '</span><span class="txt">' + label + '</span>';
                b.addEventListener("click", () => {
                    // 编辑不收起这一行：改完点取消还能接着点别的
                    if (!keep) { cmActs.hidden = true; cmActsFor = null; paintCmSel(null); }
                    fn();
                });
                cmActs.appendChild(b);
            });
            cmActs.hidden = false;
        };

        cmList.forEach(def => {
            const exists = state.devices.some(d => d.type === def.id);
            // 用 div 而非 button：卡片内还要放「管理」小按钮（button 不能嵌套 button）
            const card = document.createElement("div");
            card.className = "card cm" + (exists ? " on has-tag" : "");
            card.innerHTML = '<span class="ico">' + esc(def.icon || "📦") + '</span>' +
                '<span class="name">' + esc(def.name) + '</span>' +
                '<span class="sub">' + esc(def.sub || "整机模板") + '</span>' +
                (exists ? '<span class="cm-tag">已添加</span>' : '');
            card.dataset.cmId = def.id;
            card.addEventListener("click", () => showCmActs(def));
            cmEl.appendChild(card);
        });

        const plus = document.createElement("button");
        plus.className = "card plus" + (hasCm() ? " locked" : "");
        plus.innerHTML = '<span class="ico">＋</span><span class="name">添加整机模板</span><span class="sub">完整 YAML 一键整机</span>';
        plus.addEventListener("click", () => {
            const row = $("tplAddRow");
            row.hidden = !row.hidden;   // 不弹层：点一下在下方展开一行三张卡
        });
        cmEl.appendChild(plus);
        cmEl.appendChild(cmActs);   // 动作卡垫在网格最后一行（整行）
    }

    function addDevice(type) {
        const cmT = cmDef(type);
        const cmName = cmT ? cmT.name : (TYPES[type] ? TYPES[type].name : "整机");
        if (cmT) {
            if (state.devices.some(d => d.type === type)) { showToast(cmName + " 已添加，不能重复添加"); return; }
            const others = state.devices.filter(d => d.type !== type);
            if (others.length) {
                // 整机模板与通用设备互斥：YAML 生成时只走整机分支，两者并存会让通用设备静默丢失
                const ok = confirm(cmName + " 是整机专属模板，生成的完整配置与通用设备互斥。\n继续将清空已添加的 " + others.length + " 个设备，是否继续？");
                if (!ok) return;
                state.devices = [];
                state.seq = {};
            }
        } else if (hasCm()) {
            showToast("已添加" + (cmDef(cmDev().type) || {}).name + " 整机，不能再添加通用设备");
            return;
        }

        const wantChip = cmT && (cmT.chip === "esp32" || cmT.chip === "esp8266") ? cmT.chip : "";
        if (wantChip && state.chip !== wantChip) {
            state.chip = wantChip;
            state.devices.forEach(d => { if (!isCmType(d.type)) d.pinOverrides = {}; });
            renderChips();
        }
        
        const t = TYPES[type] || cmT;

        let dev = { uid: nextUid(type), type, name: t.name, pinOverrides: {}, actions: [] };

        if (type === "cm_w1") {
            dev.cfg = {
                homekitCode: fmtHkCode(state.hkCode).replace(/\D/g, ""),  // 默认跟随全局配对码（纯数字 8 位）
                masterName: "⚡总开关 Master Switch",
                masterPin: "GPIO0",
                slaveName: "🔌分路开关 Slave Switch",
                slavePin: "GPIO12",
                enablePin: "GPIO15",
                buttonPin: "GPIO4",
                clickAction: "toggle_slave",
                doubleClickAction: "toggle_master",
                longPressAction: "factory_reset",
                longPressMs: 5000,
                ledBluePin: "GPIO16",
                ledRedPin: "GPIO14",
                ledWhitePin: "GPIO5",
                uartTx: "GPIO1",
                uartRx: "GPIO3",
                sensors: { voltage: true, current: true, power: true, energy: true, dailyEnergy: true, reactivePower: true, powerFactor: true, frequency: true, chipTemp: true }
            };
            dev.name = "CMPOWER W1";
        } else if (cmT && !TYPES[type]) {
            // 自定义整机模板：参数取自模板声明，默认值填入
            dev.vars = {};
            (cmT.vars || []).forEach(v => { dev.vars[v.key] = (v.def == null ? "" : v.def); });
            dev.name = cmT.name;
        } else {
            // 名称带上序号（与 id 后缀一致），便于从名字区分同类设备
            const n = dev.uid.slice(type.length + 1);
            dev.name = t.name + " " + n;
            // 输出/信号方向与 WiFi 指示灯：反向输出开关关闭=常规、打开=反向；
            // 门磁/人体/按键类信号默认低电平触发（保持反向）
            dev.io = { inverted: t.kind === "binary", boot: "off", statusLed: false };
            if (type === "button") {
                dev.io.longReset = true; dev.io.longResetSec = 5;    // 长按重置配对（默认开）
                dev.io.factoryReset = false; dev.io.factoryResetSec = 10;  // 长按恢复出厂（默认关）
            }
            // 默认引脚若已被占用（如再加一个继电器），自动挑一个空闲脚
            autoAssignPins(dev);
        }

        state.devices.push(dev);
        // 整机加入后芯片/板型/FLASH 会按模板锁定（forcedChip），必须立刻重绘芯片区，
        // 否则要等下一次别的操作才会变灰，期间用户还能点板型/FLASH 却对生成结果无效
        renderChips(); renderTypes(); renderDevices();
    }

    function deleteDevice(uid) {
        state.devices = state.devices.filter(d => d.uid !== uid);
        state.devices.forEach(d => { d.actions = d.actions.filter(a => a.target !== uid); });
        renderChips(); renderTypes(); renderDevices();
        if (state.editingUid === uid) { state.editingUid = null; hideSheets(); }
    }

    /* ================= 已添加列表 ================= */
    // 自定义整机模板：开关/私钥不适用，但主题卡照常显示（从模板 YAML 解析出来）
    function paintBemfaSection() {
        const d = cmDev();
        const custom = !!(d && !CM_TYPES[d.type]);
        const sec = $("bemfaSection"), box = $("bemfaBox"), lock = $("bemfaLocked"), hint = $("bemfaHint");
        if (sec) sec.hidden = !featOpen || !(custom || state.bemfa.on);   // 展开 + 自身开着才出现
        if (box) box.hidden = custom ? false : !state.bemfa.on;
        if (lock) lock.hidden = true;
        if (hint) hint.textContent = custom ? "模板内主题" : "手机远程";
    }

    function renderDevices() {
        scheduleSave();        // 设备/引脚一改就落盘
        paintBemfaSection();
        renderBemfaTopics();   // 巴法云主题列表跟着设备走
        const list = $("deviceList");
        const n = state.devices.length;
        $("devCount").textContent = n ? "共 " + n + " 项" : "";

        if (!n) { list.innerHTML = '<div class="dev-empty">还没有添加设备，点上方卡片添加</div>'; return; }
        list.innerHTML = "";

        state.devices.forEach(dev => {
            // 一行两张卡：左=设备信息（点进详情），右=减号（删除）
            const row = document.createElement("div");
            row.className = "dev-row";
            const minus = document.createElement("button");
            minus.type = "button";
            minus.className = "dev-minus";
            minus.textContent = "−";
            minus.title = "删除设备";
            minus.addEventListener("click", () => deleteDevice(dev.uid));

            const cd = cmDef(dev.type);
            if (cd && !TYPES[dev.type]) {
                const card = document.createElement("div");
                card.className = "dev-card cm";
                let meta;
                if (dev.type === "cm_w1") {
                    // 卡面只留一行配对码：引脚信息在详情页，手机上才不会挤出版
                    const c = dev.cfg;
                    meta = '<div class="dev-pin">HomeKit配对码' + esc(String(c.homekitCode || "").replace(/-/g, "")) + '</div>';
                } else {
                    // 模板卡只显示固定两行，不再罗列参数（参数一多会顶出卡片）
                    meta = '<div class="dev-pin">' + esc(cd.sub || "整机模板") + '</div>' +
                        '<div class="dev-links">整机模板 · 生成完整 YAML</div>';
                }
                card.innerHTML =
                    '<div class="dev-icon">' + esc(cd.icon || "📦") + '</div>' +

    /* ================= WiFi 二维码 ================= */
    // 手机/路由器「分享 WiFi」出来的二维码是 WIFI:T:WPA;S:名称;P:密码;;
    function parseWifiQR(text) {
        if (!/^WIFI:/i.test(String(text || ""))) return null;
        const body = String(text).slice(5);
        const parts = [];
        let cur = "", esc = false;
        for (const ch of body) {
            if (esc) { cur += ch; esc = false; continue; }
            if (ch === "\\") { esc = true; continue; }
            if (ch === ";") { parts.push(cur); cur = ""; continue; }
            cur += ch;
        }
        if (cur) parts.push(cur);
        const out = { ssid: "", pass: "" };
        parts.forEach(p => {
            const k = p.slice(0, 1).toUpperCase();
            const v = p.slice(2);
            if (k === "S") out.ssid = v;
            else if (k === "P") out.pass = v;
        });
        return out.ssid ? out : null;
    }

    async function scanWifiQRCode() {
        const btn = $("btnWifiScan");
        if (!btn || btn.dataset.busy === "1") return;
        const label = btn.textContent;
        const say = (txt, ms) => { btn.textContent = txt; setTimeout(() => { btn.textContent = label; }, ms || 2000); };
        if (!navigator.mediaDevices || typeof navigator.mediaDevices.getUserMedia !== "function" || typeof window.BarcodeDetector !== "function") {
            say("此浏览器不支持", 2200);   // 需要 Chrome/Edge + 摄像头
            return;
        }
        let stream = null;
        btn.dataset.busy = "1";
        try {
            btn.textContent = "扫描中…";
            stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            const video = document.createElement("video");
            video.srcObject = stream;
            video.setAttribute("playsinline", "");
            await video.play();
            const det = new window.BarcodeDetector({ formats: ["qr_code"] });
            const t0 = Date.now();
            let found = null;
            while (Date.now() - t0 < 20000) {
                const codes = await det.detect(video).catch(() => []);
                for (const c of codes) {
                    found = parseWifiQR(c.rawValue || c.rawData || "");
                    if (found) break;
                }
                if (found) break;
                await new Promise(r => setTimeout(r, 250));
            }
            if (found) {
                $("wifiSsid").value = found.ssid;
                state.wifi.ssid = found.ssid.trim();
                $("wifiPass").value = found.pass;
                state.wifi.pass = found.pass;
                say("已填入", 1800);
            } else {
                say("没识别到", 2200);
            }
        } catch (e) {
            say("相机不可用", 2200);
        } finally {
            if (stream) stream.getTracks().forEach(t => t.stop());
            delete btn.dataset.busy;
        }
    }

    function pinChips(parent, currentPin, onChange, opts) {
        const wrap = document.createElement("div");
        wrap.className = "pin-chips";
        const pins = CHIP_PINS[state.chip] || [];
        const all = pins.slice();
        if (currentPin && !all.includes(currentPin)) all.unshift(currentPin);
        if (opts && opts.allowNone) all.unshift(""); // 空值 = 不启用
        all.forEach(p => {
            const btn = document.createElement("button");
            btn.type = "button";
            // 已被其他设备占用的脚：置灰不可选（同脚会导致配置校验失败）
            const usedBy = (p && opts && opts.usedPins) ? opts.usedPins.get(p) : null;
            btn.className = "pin-chip" + (p === currentPin ? " on" : "") + (usedBy ? " used" : "");
            btn.textContent = p === "" ? "不启用" : p.replace("GPIO", "");
            if (usedBy) {
                btn.disabled = true;
                btn.title = "已被「" + usedBy + "」占用";
            }
            btn.addEventListener("click", () => {
                // 选中态在本组内就地切换，避免整体重绘导致输入框失焦、页面跳回顶部
                wrap.querySelectorAll(".pin-chip.on").forEach(x => x.classList.remove("on"));
                btn.classList.add("on");
                onChange(p);
            });
            wrap.appendChild(btn);
        });
        parent.appendChild(wrap);
        return wrap;
    }

    function checkChip(parent, label, checked, onChange) {
        const btn = document.createElement("button");
        btn.className = "chk" + (checked ? " on" : "");
        btn.innerHTML = '<span class="chk-box">✓</span>' + esc(label);
        btn.addEventListener("click", () => onChange(!checked));
        parent.appendChild(btn);
        return btn;
    }

    // 开/关 两卡片开关：替代下拉框与勾选框，选中即高亮
    // opts: { onSub, offSub, onName='开', offName='关' }
    function toggleCards(parent, on, opts, onChange) {
        const o = opts || {};
        const wrap = document.createElement("div");
        wrap.className = "sw-cards";
        [
            { val: false, name: o.offName || "关", sub: o.offSub || "" },
            { val: true, name: o.onName || "开", sub: o.onSub || "" }
        ].forEach(it => {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "sw-card" + (on === it.val ? " on" : "");
            btn.innerHTML = '<span class="name">' + esc(it.name) + '</span>' +
                (it.sub ? '<span class="sub">' + esc(it.sub) + '</span>' : "");
            btn.addEventListener("click", () => {
                // 就地切换选中态，避免整页重绘导致滚动位置丢失
                wrap.querySelectorAll(".sw-card.on").forEach(x => x.classList.remove("on"));
                btn.classList.add("on");
                onChange(it.val);
            });
            wrap.appendChild(btn);
        });
        parent.appendChild(wrap);
        return wrap;
    }

                }
                // 第二档：长按恢复出厂（清 NVS + WiFi 凭据，默认关）
                const fwRow = document.createElement("div"); fwRow.className = "form-row";
                fwRow.innerHTML = '<label class="form-label">长按恢复出厂</label>';
                toggleCards(fwRow, !!dev.io.factoryReset, { offSub: "不启用", onSub: "清空并重启" }, v => {
                    dev.io.factoryReset = v;
                    renderDetailGeneric(dev);
                });
                ioSection.appendChild(fwRow);
                if (dev.io.factoryReset) {
                    const fwSec = document.createElement("div"); fwSec.className = "form-row";
                    fwSec.innerHTML = '<label class="form-label">恢复出厂时长（秒）</label><input class="form-input" type="number" id="fwSec" min="1" max="60" step="1" value="' + (parseInt(dev.io.factoryResetSec, 10) || 10) + '">';
                    ioSection.appendChild(fwSec);
                    fwSec.querySelector("#fwSec").addEventListener("input", e => {
                        const v = parseInt(e.target.value, 10);
                        dev.io.factoryResetSec = isNaN(v) ? 10 : Math.min(Math.max(v, 1), 60);
                    });
                }
            }
        }
        // 网络状态指示：直接用本设备这颗灯的引脚，不额外占脚（输入类设备不显示）
        if (t.kind === "switch") {
            if (typeof dev.io.statusLed !== "boolean") dev.io.statusLed = false;
            const ledRow = document.createElement("div"); ledRow.className = "form-row";
            ledRow.innerHTML = '<label class="form-label">网络状态指示</label>';
            toggleCards(ledRow, dev.io.statusLed, { offSub: "不启用", onSub: "断网亮 / 联网灭" },
                v => { dev.io.statusLed = v; renderDetailGeneric(dev); });
            ioSection.appendChild(ledRow);


            // 只做指示灯的开关（如板载蓝灯/红灯）：照常出现在设备网页，但不进家庭 App
            if (typeof dev.io.localOnly !== "boolean") dev.io.localOnly = false;
            const loRow = document.createElement("div"); loRow.className = "form-row";
            loRow.innerHTML = '<label class="form-label">仅作指示灯</label>';
            toggleCards(loRow, dev.io.localOnly, { offSub: "接入 HomeKit", onSub: "只在本机网页" },
                v => { dev.io.localOnly = v; });
            ioSection.appendChild(loRow);
        }
        body.appendChild(ioSection);

        if (t.events && t.events.length) body.appendChild(buildActionsSection(dev));
        body.scrollTop = keepScroll;
    }

    // --- 自定义整机模板的详情页 ---
    // 老模板（保存时还没做自动转参数）在这里自愈：YAML 里写死 GPIOx 又没有任何自定义占位符时，
    // 就地转成 {{pin_gpioN}} 参数并存回去，默认值仍是原引脚（生成结果不变）
    function maybeParametrizeTpl(def) {
        if (!def || !def.yaml) return false;
        const hasCustom = /\{\{\s*[A-Za-z0-9_.-]+\s*\}\}/.test(
            def.yaml.replace(/\{\{\s*(deviceName|node_name|board|chip|flash|wifi_ssid|wifi_pass|hk_code)\s*\}\}/g, "")
        );
        if (hasCustom || !/GPIO\d+/.test(def.yaml)) return false;
        const seen = {};
        def.yaml = def.yaml.replace(/GPIO(\d+)/g, (m, n) => {
            const k = "pin_gpio" + n;
            seen[k] = "GPIO" + n;
            return "{{" + k + "}}";
        });
        def.vars = Object.keys(seen).map(k => ({ key: k, label: k, type: "pin", def: seen[k] }));
        saveCmTemplates();
        pushTplCloud();
        return true;
    }

                // 名字里带 pin 的参数一律按引脚渲染（老模板里存的 text 类型也纠正过来）
                if (v.type === "pin" || /pin/i.test(v.key)) {

                    lab.innerHTML = '<span>' + esc(v.label || v.key) + '</span><span>' + esc(cur) + '</span>';
                    g.appendChild(lab);
                    pinChips(g, cur, p => {
                        dev.vars[v.key] = p;
                        const sp = lab.querySelector("span:last-child"); if (sp) sp.textContent = p;
                        renderDevices();
                    }, { usedPins: usedPinMap(dev.uid) });
                    sec.appendChild(g);
                } else {
                    const row = document.createElement("div"); row.className = "form-row";
                    row.innerHTML = '<label class="form-label">' + esc(v.label || v.key) + '</label>';
                    const inp = document.createElement("input");

    function buildActionItem(dev, act, idx, targets) {

        evtSel.addEventListener("change", e => { act.event = e.target.value; });
        line1.appendChild(evtSel); line1.appendChild(document.createTextNode(" 时"));

        const line2 = document.createElement("div"); line2.className = "action-line";
        line2.appendChild(document.createTextNode("将 "));

        targets.forEach(tg => { const o = document.createElement("option"); o.value = tg.uid; o.textContent = tg.name; if (tg.uid === act.target) o.selected = true; tgtSel.appendChild(o); });
        tgtSel.addEventListener("change", e => { act.target = e.target.value; });
        line2.appendChild(tgtSel); line2.appendChild(document.createTextNode(" "));

    /* ================= 巴法云（MQTT 直连 bemfa.com） =================
       巴法云的限制：主题名的后三位决定设备类型（006 开关 / 004 传感器），App 订阅的是裸话题名，
       ESPHome 的实体话题对不上，所以统一用裸话题 + on_message/mqtt.publish（见 buildYaml）。
       一台设备一个私钥：client_id 也是私钥，两个设备同私钥会互相把对方顶下线。 */
    const BEMFA_PREFIX = "";   // 不加前缀：主题名就是「设备名 + 类型码」
    // 私钥很長，刷新页面丢了很烦：和整机模板一样存在本机浏览器里
    function bemfaSave() {
        try { localStorage.setItem("eh-bemfa", JSON.stringify(state.bemfa)); } catch (e) { }
    }
    function bemfaLoad() {
        try {
            const o = JSON.parse(localStorage.getItem("eh-bemfa") || "null");
            if (!o || typeof o !== "object") return;
            state.bemfa.on = !!o.on;
            state.bemfa.uid = typeof o.uid === "string" ? o.uid : "";
        } catch (e) { }
    }
    // 主题名固定跟「设备名 + MAC 后缀」走（就是 ESPHome 里那个自动加后缀的名字），
    // 同一个设备无论怎么重加卡片，主题都不会变；同类型的第 2 个实体起加序号区分。
    function bmSan(s) { return String(s || "").replace(/[^A-Za-z0-9]/g, ""); }   // 巴法后台只收字母和数字
    // 主题前缀就是设备名（ESPHome 会在后面自动接 MAC 后缀，那是运行时的事，这里只管用户填的名字）
    function bmBaseName() { return bmSan(state.nodeName || "esp_homekit_device"); }
    function bemfaTopic(n, suffix) {
        // 巴法主题允许字母/数字/下划线，且必须以后三位类型码结尾
        return BEMFA_PREFIX + bmBaseName() + n + suffix;   // orvibo49ff8e1006（只含字母数字，巴法才收）
    }
    // 取某个设备某类型的主题（同类型多个时按 idx 取第几个）
    function bmTopicOf(dev, suffix, idx) {
        const hit = bemfaEntityList().filter(e => e.suffix === suffix && e.dev === dev)[idx || 0];
        return hit ? hit.topic : bemfaTopic(1, suffix);
    }
    // 设备 → 巴法主题的映射表（UI 卡片与生成的 YAML 共用同一份，保证对得上）
    function bemfaEntityList() {
        const out = [], cnt = { "006": 0, "004": 0 };
        const push = (dev, suffix, kind, label) => {
            cnt[suffix] += 1;
            out.push({ dev: dev, kind: kind, suffix: suffix, label: label, topic: bemfaTopic(cnt[suffix], suffix) });
        };
        state.devices.forEach(d => {
            if (d.io && d.io.bemfa === false) return;   // 手动删掉的项
            if (d.type === "cm_w1") {
                push(d, "006", "switch", d.name + " 总控");
                push(d, "006", "switch", d.name + " 分控");
            } else if (d.type === "relay") push(d, "006", "switch", d.name);
            else if (d.type === "dht") push(d, "004", "sensor", d.name);
            else if (d.type === "bh1750") push(d, "004", "sensor", d.name);
        });
        return out;
    }
    // 整机模板：从生成的 YAML 里解析出所有巴法云主题（on_message 与 /set 发布都算）
function parseTplTopics(yaml) {
    const out = [], seen = new Set();
    const lines = String(yaml || "").split("\n");
    lines.forEach((line, i) => {
        const m = line.match(/^\s*(?:-\s*)?topic:\s*([A-Za-z0-9_.-]+?)(\/set)?\s*$/);
        if (!m) return;
        const t = m[1];
        if (seen.has(t)) return;
        seen.add(t);
        let who = "";
        for (let k = i; k < Math.min(i + 8, lines.length); k++) {
            const im = lines[k].match(/id\(([A-Za-z0-9_]+)\)/);
            if (im) { who = im[1]; break; }
        }
        out.push({ topic: t, who: who });
    });
    return out;
}
// 能映射到巴法 App 的设备：继电器→开关，温湿度/光照→传感器，CMPOWER 整机→总控/分控
    function bemfaEntries() {
        return bemfaEntityList().map(e => ({ topic: e.topic, name: e.label, kind: e.kind, dev: e.dev }));
    }
    function renderBemfa() {
        const box = $("bemfaBox");
        if (!box) return;
        box.hidden = !state.bemfa.on;
        $("bemfaUid").value = state.bemfa.uid;
        renderBemfaTopics();
        paintBemfaSection();
    }
    // 主题卡：既显示话题，又是复制按钮，点完就地变「已复制」
    function renderBemfaTopics() {
        const listEl = $("bemfaTopics");
        if (!listEl) return;
        listEl.innerHTML = "";
        // 整机模板：主题写在模板 YAML 里，这里从生成结果里解析出来展示（只读、可复制）
        const cnd = cmDev();

            const list = parseTplTopics(buildYaml());

            }
            list.forEach(e => {

                b.type = "button";

                    '<span class="sub">' + esc(e.who ? e.who + " · 模板内" : "模板内主题") + '</span>';
                b.addEventListener("click", async () => {

        const list = bemfaEntries();
        if (!list.length) {
            const c = document.createElement("div");
            c.className = "card board";

            c.innerHTML = '<span class="name">还没有可映射的设备</span>';
            listEl.appendChild(c);
            return;
        }
        list.forEach(e => {
            const b = document.createElement("button");
            b.type = "button";
            b.className = "card board bm-card";
            b.innerHTML = '<span class="name">' + esc(e.topic) + '</span>' +
                '<span class="sub">' + esc(e.name + " · " + (e.kind === "switch" ? "开关" : "传感器")) + '</span>';
            // 右上角 ✕：把这个主题（连同生成的 mqtt 代码）去掉
            if (e.dev && e.dev.type !== "cm_w1") {
                const del = document.createElement("span");
                del.className = "bm-del";
                del.textContent = "✕";
                del.setAttribute("aria-label", "删除这个主题");
                del.addEventListener("click", ev => {
                    ev.stopPropagation();
                    if (!e.dev.io) e.dev.io = {};
                    e.dev.io.bemfa = false;
                    scheduleSave();
                    renderBemfa();
                });
                b.appendChild(del);
            }
            b.addEventListener("click", async () => {
                const ok = await copyText(e.topic);
                const sub = b.querySelector(".sub");
                const old = sub.textContent;
                b.classList.add("on");
                sub.textContent = ok ? "已复制" : "复制失败";
                setTimeout(() => { b.classList.remove("on"); sub.textContent = old; }, 1200);
            });
            listEl.appendChild(b);
        });
        // 被删掉的设备：给一张恢复卡，随时能加回来
        const removed = state.devices.filter(d => d.io && d.io.bemfa === false);
        if (removed.length) {
            const back = document.createElement("button");
            back.type = "button";
            back.className = "card plus";
            back.style.gridColumn = "1 / -1";
            back.innerHTML = '<span class="ico">↺</span><span class="name">恢复 ' + removed.length + ' 个主题</span>' +
                '<span class="sub">' + esc(removed.map(d => d.name).join("、")) + '</span>';
            back.addEventListener("click", () => {
                removed.forEach(d => { d.io.bemfa = true; });
                scheduleSave();
                renderBemfa();
            });
            listEl.appendChild(back);
        }
        const all = document.createElement("button");
        all.type = "button";
        all.className = "card plus";
        all.innerHTML = '<span class="ico">⧉</span><span class="name">复制全部</span><span class="sub">共 ' + list.length + ' 个</span>';
        all.addEventListener("click", async () => {
            const ok = await copyText(list.map(e => e.topic).join("\n"));
            const sub = all.querySelector(".sub");
            const old = sub.textContent;
            all.classList.add("on");
            sub.textContent = ok ? "已复制" : "复制失败";
            setTimeout(() => { all.classList.remove("on"); sub.textContent = old; }, 1200);
        });
        listEl.appendChild(all);
    }

    /* ================= 日志级别（写进 YAML 的 logger: level） =================
       ESPHome 不写 logger 时默认 DEBUG，输出很吵；查问题时切 DEBUG / VERBOSE，
       再在烧录卡里的串口监视器（115200）看输出。 */
    const LOG_LEVELS = [
        { k: "WARN", d: "只留告警" },
        { k: "INFO", d: "默认" },
        { k: "DEBUG", d: "查 bug" },
        { k: "VERBOSE", d: "最详细" }
    ];
    function renderLogLevels() {
        const el = $("logGrid");
        if (!el) return;
        el.innerHTML = "";
        LOG_LEVELS.forEach(l => {

            b.addEventListener("click", () => { state.logLevel = l.k; renderLogLevels(); });

    /* ================= YAML 生成引擎 ================= */
    function tplSlug(s) {
        return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 32) || "esphome_device";
    }

    // 自定义整机模板：整份 YAML 由模板决定，占位符替换后原样输出
    function buildTplYaml(dev) {
        const def = cmDef(dev.type);
        const chip = def.chip === "esp32" ? "esp32" : (def.chip === "esp8266" ? "esp8266" : state.chip);
        const bmap = {
            deviceName: dev.name,
            node_name: def.node || tplSlug(dev.name),
            board: chip === state.chip ? currentBoardId() : (state.board[chip] === "custom" ? state.customBoard[chip] : state.board[chip]),
            chip: chip,
            flash: chip === state.chip ? currentFlash() : (state.flash[chip] === "custom"
                ? (parseFloat(state.customFlash[chip]) > 0 ? parseFloat(state.customFlash[chip]) + "MB" : "4MB")
                : (state.flash[chip] || "4MB")),
            wifi_ssid: state.wifi.ssid || "",
            wifi_pass: state.wifi.pass || "",
            hk_code: fmtHkCode(state.hkCode).replace(/\D/g, "")
        };
        Object.keys(dev.vars || {}).forEach(k => { bmap[k] = dev.vars[k]; });
        // 模板里声明的变量，值没填时用它自己的默认值；再没有就置空，绝不把 {{x}} 漏进 YAML
        const tplVars = def.vars || [];
        const varDef = k => {
            const v = tplVars.find(x => x.key === k);
            return v && v.def != null ? String(v.def) : "";
        };
        const out = String(def.yaml || "").replace(/\{\{\s*([A-Za-z0-9_.-]+)\s*\}\}/g, (m, k) =>
            Object.prototype.hasOwnProperty.call(bmap, k) && bmap[k] !== "" && bmap[k] != null
                ? String(bmap[k])
                : varDef(k));
        // 整机模板也支持注入巴法云：把模板里的开关一个个挂上主题
        return out;   // 自定义整机模板不注入巴法云（用户自己写）
    }

    // 给整机模板的 YAML 注入巴法云：开关加 on_turn_on/off 上报，末尾补 mqtt 段
    function injectTplBemfa(yaml) {
        const uid = state.bemfa.uid || "";
        if (/^mqtt:/m.test(yaml)) return yaml;          // 模板自带 mqtt，不重复注入
        const lines = yaml.split("\n");
        const start = lines.findIndex(l => /^switch:\s*$/.test(l));
        if (start < 0) return yaml;                     // 没有 switch 段，跳过

        // 找到 switch 段的结束位置（下一个顶格 key）
        let end = lines.length;
        for (let i = start + 1; i < lines.length; i++) {
            if (/^[A-Za-z_]/.test(lines[i])) { end = i; break; }
        }
        const body = lines.slice(start + 1, end);
        const blocks = [];
        let cur = null;
        body.forEach(l => {
            if (/^\s{2}- /.test(l)) { if (cur) blocks.push(cur); cur = [l]; }
            else if (cur) cur.push(l);
        });
        if (cur) blocks.push(cur);

        const topics = [];
        blocks.forEach(blk => {
            const text = blk.join("\n");
            if (/internal:\s*true/.test(text)) return;
            const idm = text.match(/^\s+id:\s*([A-Za-z0-9_]+)\s*$/m);
            if (!idm) return;
            const id = idm[1];
            if (/on_turn_on:/.test(text) || /on_turn_off:/.test(text)) return;   // 已有回调，避免重复键
            const topic = bemfaTopic(id, "006");
            topics.push({ id: id, topic: topic });
            while (blk.length && blk[blk.length - 1].trim() === "") blk.pop();
            blk.push("    on_turn_on:");
            blk.push("      - mqtt.publish:");
            blk.push("          topic: " + topic + "/set");
            blk.push('          payload: "on"');
            blk.push("    on_turn_off:");
            blk.push("      - mqtt.publish:");
            blk.push("          topic: " + topic + "/set");
            blk.push('          payload: "off"');
        });
        if (!topics.length) return yaml;

        const rebuilt = [].concat(lines.slice(0, start + 1), ...blocks.map((b, i) => (i === blocks.length - 1 ? b : b.concat([""]))), lines.slice(end));
        const out = rebuilt.join("\n");
        const mq = [];
        mq.push("");
        mq.push("# ================= 巴法云（模板注入） =================");
        topics.forEach(t => mq.push("#   " + t.topic + "   " + t.id));
        mq.push("mqtt:");
        mq.push("  broker: bemfa.com");
        mq.push("  port: 9501");
        mq.push('  username: "' + uid + '"');
        mq.push('  password: "' + uid + '"');
        mq.push('  client_id: "' + uid + '"');
        mq.push('  topic_prefix: "esphome_bridge"');
        mq.push("  discovery: false");
        mq.push("  on_message:");
        topics.forEach(t => {
            mq.push("    - topic: " + t.topic);
            mq.push("      then:");
            mq.push("        - lambda: |-");
            mq.push('            if (x == "on") { id(' + t.id + ').turn_on(); }');
            mq.push('            else if (x == "off") { id(' + t.id + ').turn_off(); }');
        });
        return out.replace(/\s*$/, "") + "\n" + mq.join("\n") + "\n";
    }


    /* ===== 整机模板「反填」：把模板 YAML 解析回上方的卡片与设备卡 ===== */
    function tplSection(yaml, key) {
        const lines = String(yaml || "").replace(/\r/g, "").split("\n");
        const start = lines.findIndex(l => new RegExp("^" + key + ":\\s*$").test(l));
        if (start < 0) return [];
        const out = [];
        for (let i = start + 1; i < lines.length; i++) {
            if (/^[A-Za-z_]/.test(lines[i])) break;
            out.push(lines[i]);
        }
        return out;
    }
    function tplChunks(lines) {
        const out = [];
        let cur = null;
        lines.forEach(l => {
            if (/^\s{2}- /.test(l)) { if (cur) out.push(cur); cur = [l]; }
            else if (cur) cur.push(l);
        });
        if (cur) out.push(cur);
        return out;
    }
    function tplPin(text) {
        const m = String(text || "").match(/GPIO\s*(\d+)/i);
        return m ? "GPIO" + m[1] : "";
    }
    function tplParse(yaml) {
        const r = { name: "", friendly: "", board: "", chip: "esp8266", flash: "", ssid: "", pass: "", hk: "", sw: [], bs: [], sens: [] };
        const esp = tplSection(yaml, "esphome");
        esp.forEach(l => {
            let m = l.match(/^\s+name:\s*"([^"]*)"/); if (m) r.name = m[1];
            m = l.match(/^\s+friendly_name:\s*"([^"]*)"/); if (m) r.friendly = m[1];
            m = l.match(/ldscript:\s*\S*flash\.(\d)m/i); if (m) r.flash = m[1] + "MB";
        });
        const b32 = tplSection(yaml, "esp32"), b8266 = tplSection(yaml, "esp8266");
        if (b32.length) r.chip = "esp32";
        b32.concat(b8266).forEach(l => {
            const m = l.match(/^\s+board:\s*(\S+)/);
            if (m && !r.board) r.board = m[1];
        });
        tplSection(yaml, "wifi").forEach(l => {
            let m = l.match(/^\s{2}ssid:\s*"([^"]*)"/); if (m && !r.ssid) r.ssid = m[1];
            m = l.match(/^\s{2}password:\s*"([^"]*)"/); if (m && !r.pass) r.pass = m[1];
        });
        r.hkSw = [];
        let hkSec = "setup";
        tplSection(yaml, "homekit").forEach(l => {
            const m = l.match(/setup_code:\s*"([^"]+)"/);
            if (m) r.hk = m[1];
            if (/^\s{2}switches:/.test(l)) { hkSec = "sw"; return; }
            if (/^\s{2}\S/.test(l)) { hkSec = "other"; return; }
            if (hkSec === "sw") { const s = l.match(/^\s{4}-\s*([A-Za-z0-9_]+)/); if (s) r.hkSw.push(s[1]); }
        });
        tplChunks(tplSection(yaml, "switch")).forEach(chunk => {
            const text = chunk.join("\n");
            let id = "", name = "";
            chunk.forEach(l => {
                let m = l.match(/^\s{4}id:\s*([A-Za-z0-9_]+)/); if (m) id = m[1];
                m = l.match(/^\s{4}name:\s*"?([^"\n]*)"?/); if (m) name = m[1].trim();
            });
            const pin = tplPin(text);
            if (!pin) return;
            const acts = [];
            let ev = "on_turn_on";
            chunk.forEach(l => {
                const e = l.match(/^\s{4}(on_turn_on|on_turn_off|on_press|on_release):/);
                if (e) ev = e[1];
                const a = l.match(/(switch\.turn_on|switch\.turn_off|switch\.toggle):\s*([A-Za-z0-9_]+)/);
                if (a) acts.push({ event: ev, yaml: a[1], target: a[2] });
            });
            r.sw.push({ id: id, name: name || id, pin: pin, on: /restore_mode:\s*ALWAYS_ON/.test(text), inv: /inverted:\s*true/.test(text), acts: acts });
        });
        tplChunks(tplSection(yaml, "binary_sensor")).forEach(chunk => {
            const text = chunk.join("\n");
            if (!/platform:\s*gpio/.test(text)) return;
            let id = "", name = "";
            chunk.forEach(l => {
                let m = l.match(/^\s{4}id:\s*([A-Za-z0-9_]+)/); if (m) id = m[1];
                m = l.match(/^\s{4}name:\s*"?([^"\n]*)"?/); if (m) name = m[1].trim();
            });
            const pin = tplPin(text);
            if (!pin) return;
            const acts = [];
            let ev = "on_press", op = "toggle";
            chunk.forEach(l => {
                const e = l.match(/^\s{4}(on_click|on_press|on_release|on_multi_click):/);
                if (e) ev = e[1] === "on_click" ? "on_press" : e[1];
                const a = l.match(/(switch\.turn_on|switch\.turn_off|switch\.toggle):\s*([A-Za-z0-9_]+)/);
                if (a) acts.push({ event: ev, yaml: a[1], target: a[2] });
            });
            const kind = /device_class:\s*(motion|door)/.exec(text);
            r.bs.push({ id: id, name: name || id, pin: pin, inv: /inverted:\s*true/.test(text), acts: acts, kind: kind ? kind[1] : "button" });
        });
        tplChunks(tplSection(yaml, "sensor")).forEach(chunk => {
            const text = chunk.join("\n");
            const plat = /platform:\s*(dht|bh1750)/.exec(text);
            if (!plat) return;
            let name = "";
            chunk.forEach(l => { const m = l.match(/^\s{4}name:\s*"?([^"\n]*)"?/); if (m) name = m[1].trim(); });
            r.sens.push({ type: plat[1], name: name || plat[1], pin: tplPin(text) });
        });
        return r;
    }
    // 回存：把当前卡片生成的 YAML 写回这个整机模板
    function tplSaveBack(tpl) {
        if (state.devices.some(d => isCmType(d.type))) {
            showToast("当前有整机模板设备，先在设备里删掉它，卡片才是通用模式");
            return;
        }
        const y = buildYaml();
        if (!y || y.length < 40) { showToast("没有可回存的内容"); return; }
        tpl.yaml = y;
        saveCmTemplates();
        scheduleSave();
        if (typeof pushTplCloud === "function") pushTplCloud();
        showToast("已回存到模板「" + tpl.name + "」");
    }
    function tplReverseApply(def) {
        let r;
        try { r = tplParse(buildTplYaml(Object.assign({}, def, { type: def.id || def.type }))); } catch (e) { showToast("解析模板失败: " + e.message); return; }
        if (!r.sw.length && !r.bs.length && !r.sens.length) { showToast("模板里没解析到可用的设备"); return; }
        const others = state.devices.filter(d => d.type !== def.id);
        if (others.length && !confirm("反填会清空现有 " + others.length + " 个设备卡，并按模板重建，继续？")) return;
        state.devices = [];
        state.seq = {};
        if (r.chip && state.chip !== r.chip) { state.chip = r.chip; }
        if (r.board) { state.board[state.chip] = "custom"; state.customBoard[state.chip] = r.board; }
        if (r.flash) { state.flash[state.chip] = r.flash; }
        if (r.name) state.nodeName = r.name;
        if (r.friendly) state.friendlyName = r.friendly;
        if (r.ssid) state.wifi.ssid = r.ssid;
        if (r.pass) state.wifi.pass = r.pass;
        if (r.hk) state.hkCode = r.hk;
        const map = {};
        const mk = (type, name) => ({ uid: nextUid(type), type: type, name: name, pinOverrides: {}, actions: [],
            io: { inverted: false, boot: "off", statusLed: false } });
        r.sw.forEach(s => {
            const d = mk("relay", s.name);
            d.pinOverrides = { pin: s.pin };
            d.io.boot = s.on ? "on" : "off";
            d.io.inverted = s.inv;
            d.io.localOnly = !!(r.hkSw && r.hkSw.length && !r.hkSw.includes(s.id));
            state.devices.push(d);
            if (s.id) map[s.id] = d.uid;
            s._dev = d;
        });
        r.sens.forEach(s => {
            const d = mk(s.type === "dht" ? "dht" : "bh1750", s.name);
            if (s.pin) d.pinOverrides = { pin: s.pin };
            state.devices.push(d);
        });
        r.bs.forEach(b => {
            const type = b.kind === "motion" ? "pir" : (b.kind === "door" ? "door" : "button");
            const d = mk(type, b.name);
            d.pinOverrides = { pin: b.pin };
            d.io.inverted = b.inv;
            state.devices.push(d);
            if (b.id) map[b.id] = d.uid;
            b._dev = d;
        });
        const opOf = y => y === "switch.turn_on" ? "turn_on" : (y === "switch.turn_off" ? "turn_off" : "toggle");
        r.sw.forEach(s => s.acts.forEach(a => {
            if (!map[a.target] || !s._dev) return;
            s._dev.actions.push({ event: a.event, op: opOf(a.yaml), target: map[a.target] });
        }));
        r.bs.forEach(b => b.acts.forEach(a => {
            if (!map[a.target] || !b._dev) return;
            b._dev.actions.push({ event: a.event, op: opOf(a.yaml), target: map[a.target] });
        }));
        // 同步到上方各输入框（否则 state 变了、界面还显示旧值）
        $("nodeNameInput").value = state.nodeName || "";
        $("friendlyInput").value = state.friendlyName || "";
        $("wifiSsid").value = state.wifi.ssid || "";
        $("wifiPass").value = state.wifi.pass || "";
        $("hkCodeInput").value = state.hkCode || "";
        $("customBoardInput").value = state.customBoard[state.chip] || "";
        $("customFlashInput").value = state.customFlash[state.chip] || "";
        renderChips(); renderTypes(); renderDevices(); scheduleSave();
        showToast("已按模板填充 " + state.devices.length + " 个设备");
    }

    // 从生成结果里按顶层键整段剔除（用于关掉 HomeKit 时去掉依赖它的段落）
    const HK_SECTIONS = ["homekit", "external_components", "button", "text_sensor"];
    function stripHomekit(lines) {

        /* ================= 通用设备模式 ================= */
        const isEsp32 = state.chip === "esp32";

        const board = currentBoardId();
        const flash = currentFlash();
        const G = [];

        G.push("# ESPHome + HomeKit 配置（通用设备模式）");
        G.push("# 由生成器自动构建 · " + (isEsp32 ? "ESP32" : "ESP8266") + " · " + board);

            G.push("# 人体感应 / 门磁 / 按键映射为 HomeKit 的运动 / 门磁传感器。");
        }
        G.push("");
        G.push("esphome:");
        // 设备名：只填基础名，主机名 = 基础名 + MAC 后缀（如 orvibo → orvibo-49ff8e）
        const nodeName = (state.nodeName || "").trim();

        if (!isEsp32) {
            G.push("  on_boot:");
            G.push("    priority: 800");
            G.push("    then:");
            G.push("      - lambda: |-");
            G.push("          WiFi.setPhyMode(WIFI_PHY_MODE_11G);");
            G.push("  platformio_options:");
            G.push("    board_build.f_cpu: 160000000L");
            // 自定义时按 MB 数换算成官方 ldscript（1m/2m/4m/8m/16m）
            G.push("    board_build.ldscript: " + currentLdscript());
            G.push("    build_flags:");
            G.push('      - "-D HOMEKIT_LOG_LEVEL=0 -D ARDUINO_HOMEKIT_LOWROM"');

        // ESPHome 生成实体 ID 时会把每个非 ASCII 字符替换成下划线，
        // 于是"汉字个数相同、只差汉字"的名字会算出同一个 ID（如 物理按键 1 与 人体感应 1 都变 _____1；
        // 温湿度自身的"温度""湿度"也会撞），配置校验直接报 Duplicate entity。
        // 这里统一做去重：重名时给后一个补一个 ASCII 后缀（用设备 id），保证编译一定过。
        const nameSeen = new Set();
        const nameKey = s => String(s).replace(/[^\x20-\x7E]/g, "_").replace(/[^a-zA-Z0-9_]/g, "_").toLowerCase();
        const uniqName = (name, uid) => {
            if (!nameSeen.has(nameKey(name))) { nameSeen.add(nameKey(name)); return name; }
            const tag = String(uid || "x").replace(/[^a-zA-Z0-9_]/g, "");
            let cand = name + " (" + tag + ")";
            let i = 2;
            while (nameSeen.has(nameKey(cand))) { cand = name + " (" + tag + "-" + i + ")"; i++; }
            nameSeen.add(nameKey(cand));
            return cand;
        };

        const OP_YAML = { turn_on: "switch.turn_on", turn_off: "switch.turn_off", toggle: "switch.toggle" };
        const relays = state.devices.filter(d => d.type === "relay");
