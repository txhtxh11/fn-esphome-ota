            .replace(/(friendly_name:\s*)".*?"/, '$1"{{deviceName}}"')
            .replace(/(\n\s*ssid:\s*).*/, '$1"{{wifi_ssid}}"')
            .replace(/(\n\s*password:\s*)".*?"/, '$1"{{wifi_pass}}"')
            .replace(/(setup_code:\s*)".*?"/, '$1"{{hk_code}}"');

        // 和保存模板时同一套规则：写死的 GPIO 自动转成引脚参数
        const hasCustom = /\{\{\s*[A-Za-z0-9_.-]+\s*\}\}/.test(
            yml.replace(/\{\{\s*(deviceName|node_name|board|chip|flash|wifi_ssid|wifi_pass|hk_code)\s*\}\}/g, "")
        );
        const autoPins = {};
        if (!hasCustom && /GPIO\d+/.test(yml)) {
            yml = yml.replace(/GPIO(\d+)/g, (m, n) => {
                const k = "pin_gpio" + n;
                autoPins[k] = "GPIO" + n;
                return "{{" + k + "}}";
            });
        }

        // 重名自动加序号
        let name = "我的整机";
        for (let i = 2; state.cmTemplates.some(t => t.name === name); i++) name = "我的整机 " + i;

        tplDraft = { id: "tpl_" + Date.now().toString(36), icon: "📦", name: name, sub: "整机模板", vars: [], yaml: yml };
        scanTplVars();
        (tplDraft.vars || []).forEach(v => {
            if (autoPins[v.key]) { v.type = "pin"; if (!v.def) v.def = autoPins[v.key]; }
        });
        const idx = state.cmTemplates.findIndex(t => t.id === tplDraft.id);
        if (idx >= 0) state.cmTemplates[idx] = tplDraft; else state.cmTemplates.push(tplDraft);
        saveCmTemplates();
        pushTplCloud();
        hideSheets();
        renderTypes();
        flashPlusCard("已存为「" + name + "」");
        const grid = $("cmTypeGrid");
        if (grid && grid.scrollIntoView) grid.scrollIntoView({ block: "center", behavior: "smooth" });
    });
    // 底部工具栏统一用 addEventListener：原来 btnCompile 同时挂了内联 onclick 和本监听，点一次会提交两次编译
    $("btnCode").addEventListener("click", openCode);
    $("btnCompile").addEventListener("click", smartCompile);

    window.__debug = {
        addDevice: addDevice,
        buildYaml: buildYaml,
        reverseTpl: tplReverseApply,
        clearTemplates: () => { state.cmTemplates = []; try { saveCmTemplates(); } catch (e) { } renderTypes(); },
        saveBackTpl: tplSaveBack,
        getState: () => state,
        setChip: chip => { state.chip = chip; },
        randomHkCode: randomHkCode,
        reset: () => { state.devices = []; state.seq = {}; state.editingUid = null; },
        // 烧录链路调试/测试出口
        flashState: flashState,
        flashNow: flashNow,
        flashRunning: () => flashRunning,
        // 测试用：注入一个假的 esptool 模块，跳过 CDN 加载
        setEsptool: m => { esptoolPromise = Promise.resolve(m); },
        flashLog: flashLog,
        monAppend: monAppend,
        monSys: monSys
    };

    // 板型卡片 / WiFi / 配对码 控件绑定
    $("customBoardInput").addEventListener("input", e => { state.customBoard[state.chip] = e.target.value.trim(); scheduleSave(); });
    $("customFlashInput").addEventListener("input", e => { state.customFlash[state.chip] = e.target.value.trim(); scheduleSave(); });
    $("nodeNameInput").addEventListener("input", e => { state.nodeName = e.target.value.trim(); scheduleSave(); });
    $("wifiSsid").addEventListener("input", e => { state.wifi.ssid = e.target.value.trim(); scheduleSave(); });
    $("wifiPass").addEventListener("input", e => { state.wifi.pass = e.target.value; scheduleSave(); });
    // 「扫描」：用摄像头扫手机/路由器上分享 WiFi 的二维码（WIFI:T:WPA;S:名称;P:密码;;），自动填进上面两格
    $("btnWifiScan").addEventListener("click", () => scanWifiQRCode());
    $("hkCodeInput").addEventListener("input", e => { state.hkCode = e.target.value; scheduleSave(); });
    $("hkCodeInput").addEventListener("blur", e => {
        // 不足/超出 8 位时 buildYaml 会静默回退成默认码，导致“看到的码”和“烧进去的码”不一致，
        // 所以失焦时直接把输入框纠正成实际会用的值
        const digits = e.target.value.replace(/\D/g, "");
        const shown = fmtHkCode(e.target.value);
        if (digits.length !== 8) {
            state.hkCode = shown;
            e.target.value = shown;
            showToast("配对码需 8 位数字，已回退为 " + shown, 3500);
        } else if (e.target.value !== shown) {
            state.hkCode = shown;   // 只补横线，不打扰
            e.target.value = shown;
        }
    });
    $("btnRandCode").addEventListener("click", () => {
        state.hkCode = randomHkCode();
        $("hkCodeInput").value = state.hkCode;
        showToast("🎲 已生成随机配对码 " + state.hkCode);
    });

    // 「＋」展开的那一行三卡：新建 / 导入 / 导出（点完自动收起）
    $("tplNew").addEventListener("click", () => { $("tplAddRow").hidden = true; showTplEditor(null); });
    $("tplImport").addEventListener("click", () => { $("tplAddRow").hidden = true; importTpl(); });
    $("tplExport").addEventListener("click", () => { $("tplAddRow").hidden = true; exportTpl(); });

    // 启动时读取已保存的自定义整机模板（localStorage 先当缓存，随后与云端合并）
    state.cmTemplates = loadCmTemplates();
    (function seedOrviboTemplates() {
        const SEED_VER = "orvibo-1";
        let done = "";
        try { done = localStorage.getItem("eh-seed-ver") || ""; } catch (e) { }
        if (done === SEED_VER) return;          // 已经补过，用户删掉的模板不再自动回来
        const have = new Set((state.cmTemplates || []).map(t => t.id));
        ORVIBO_SEED_TEMPLATES.forEach(t => {
            if (!have.has(t.id)) state.cmTemplates.push(JSON.parse(JSON.stringify(t)));
        });
        try { saveCmTemplates(); localStorage.setItem("eh-seed-ver", SEED_VER); } catch (e) { }
    })();
    pullTplCloud();

    // 恢复上次的配置：芯片/板型/FLASH/WiFi/配对码/设备卡片全部还原，刷新不用重配
    if (loadState()) {
        $("nodeNameInput").value = state.nodeName || "";
        $("friendlyInput").value = state.friendlyName || "";
        $("wifiSsid").value = state.wifi.ssid || "";
        $("wifiPass").value = state.wifi.pass || "";
        $("hkCodeInput").value = state.hkCode || "111-22-333";
        $("customBoardInput").value = state.customBoard[state.chip] || "";
        $("customFlashInput").value = state.customFlash[state.chip] || "";
    }

    // 巴法云控件
    $("bemfaUid").addEventListener("input", e => { state.bemfa.uid = e.target.value.trim(); bemfaSave(); scheduleSave(); });

    bemfaLoad();
    renderBemfa();
    renderLogLevels();
    renderErase();
    renderFeatures();
    renderChips(); renderTypes(); renderDevices();
})();
</script>
<script>
/* ===== 右上角：深浅色切换 / 选中块色调 ===== */
(function () {
    var PALETTE = window.__PALETTE || [];
    var ICON_SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.6v2.3M12 19.1v2.3M2.6 12h2.3M19.1 12h2.3M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6"/></svg>';
    var ICON_MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 14.7A8.7 8.7 0 0 1 9.3 3.6a8.7 8.7 0 1 0 11.1 11.1Z"/></svg>';

    var root = document.documentElement;
    var btnTheme = document.getElementById("btnTheme");
    var btnAccent = document.getElementById("btnAccent");
    var pop = document.getElementById("accentPop");
    var list = document.getElementById("accentList");
    if (!btnTheme || !btnAccent || !pop || !list) return;

    function theme() { return root.getAttribute("data-theme") === "light" ? "light" : "dark"; }
    function accent() { return root.getAttribute("data-accent") || "amber"; }

    function paintTheme() {
        var light = theme() === "light";
        btnTheme.innerHTML = light ? ICON_MOON : ICON_SUN;
        btnTheme.title = light ? "切换到深色" : "切换到浅色";
        btnTheme.setAttribute("aria-label", btnTheme.title);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", light ? "#f3f2ee" : "#191919");
    }
    function paintAccent() {
        var els = list.children, cur = accent(), name = "", i;
        for (i = 0; i < els.length; i++) {
            var hit = els[i].getAttribute("data-accent") === cur;
            els[i].classList.toggle("on", hit);
            if (hit) name = els[i].title;
        }
        var nm = document.getElementById("accentName");
        if (nm) nm.textContent = name || "自定义";
    }
    function setTheme(t) {
        if (t === "light") root.setAttribute("data-theme", "light"); else root.removeAttribute("data-theme");
        try { localStorage.setItem("eh-theme", t); } catch (e) { }
        paintTheme();
    }
    function setAccent(k) {
        var p = null, i;
        for (i = 0; i < PALETTE.length; i++) if (PALETTE[i].key === k) p = PALETTE[i];
        if (p) {
            var v = window.__accentVars(p.c);
            root.style.setProperty("--accent", p.c);
            root.style.setProperty("--accent-dim", v.dim);
            root.style.setProperty("--accent-rgb", v.rgb);
            root.style.setProperty("--on-accent", v.on);
        }
        root.setAttribute("data-accent", k);
        try { localStorage.setItem("eh-accent", k); } catch (e) { }
        paintAccent();
    }

    PALETTE.forEach(function (a) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "accent-swatch";
        b.setAttribute("data-accent", a.key);
        b.title = a.name;
        b.setAttribute("aria-label", a.name);
        b.style.background = a.c;
        b.style.color = (window.__accentVars && window.__accentVars(a.c).on) || "#1c1c1c";
        b.innerHTML = '<span class="sw-tick">✓</span>';
        b.addEventListener("click", function () { setAccent(a.key); pop.classList.remove("show"); });
        list.appendChild(b);
    });

    btnTheme.addEventListener("click", function () { setTheme(theme() === "light" ? "dark" : "light"); });
    btnAccent.addEventListener("click", function (e) { e.stopPropagation(); pop.classList.toggle("show"); });
    pop.addEventListener("click", function (e) { e.stopPropagation(); });
    document.addEventListener("click", function () { pop.classList.remove("show"); });
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") pop.classList.remove("show"); });

    var known = false;
    for (var j = 0; j < PALETTE.length; j++) if (PALETTE[j].key === accent()) known = true;
    if (!known && PALETTE.length) setAccent(PALETTE[0].key);
    paintTheme();
    paintAccent();
})();
</script>
<script>
/* ===== 标题隐藏入口：点主标题，在「芯片」这行右侧显示访问量，10 秒后自动收起 ===== */
(function () {
    var h1 = document.querySelector(".header h1");
    var chip = document.getElementById("chipHint");
    if (!h1 || !chip) return;
    var tag = document.createElement("span");
    tag.className = "pv-tag";
    tag.hidden = true;
    chip.parentNode.insertBefore(tag, chip.nextSibling);

    var busy = false, timer = null;
    function hide() { tag.hidden = true; if (timer) { clearTimeout(timer); timer = null; } }
    h1.addEventListener("click", function () {
        if (busy) return;
        busy = true;
        fetch(window.__API_BASE + "/api/pv?read=1", { cache: "no-store" })
            .then(function (r) { if (!r.ok) throw 0; return r.json(); })
            .then(function (j) {
                if (j && typeof j.count === "number") {
                    tag.textContent = j.count.toLocaleString();   // 只显示数字
                    tag.hidden = false;
                    if (timer) clearTimeout(timer);
                    timer = setTimeout(hide, 10000);   // 每次点击只显示 10 秒
                }
            })
            .catch(function () { })
            .then(function () { busy = false; });
    });

    // 每次打开记一次；同一标签页只记一次，避免刷新刷量
    try {
        if (!sessionStorage.getItem("eh-pv-hit")) {
            sessionStorage.setItem("eh-pv-hit", "1");
            fetch(window.__API_BASE + "/api/pv", { cache: "no-store" }).catch(function () { });
        }
    } catch (e) { }
})();
</script>
